:root{--bg:#0b1020;--panel:#141d32;--panel2:#1a2740;--line:#2a3a57;--text:#edf3ff;--muted:#9aabc7;--gold:#f4c76a;--green:#79d6a5;--red:#f17c86;--blue:#79b9ff;--purple:#bd9cff;--shadow:0 18px 50px rgba(0,0,0,.28)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 50% -10%,#22365a 0%,#10182b 38%,var(--bg) 75%);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Noto Sans JP",sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:#253653;color:var(--text);transition:.16s}button:hover{filter:brightness(1.16);transform:translateY(-1px)}button:disabled{opacity:.4;cursor:not-allowed;transform:none}.primary{background:linear-gradient(135deg,#e8b958,#c98735);border-color:#f4c76a;color:#1b1a19;font-weight:800}.subtle{background:#17243a}.danger{background:#512d3b;border-color:#824556}.success{background:#1b463e;border-color:#286d5c}.purple{background:#392c58;border-color:#5e4a88}.small{padding:6px 9px;font-size:13px;border-radius:9px}.tiny{font-size:12px;color:var(--muted)}.muted{color:var(--muted)}.gold{color:var(--gold)}.green{color:var(--green)}.red{color:var(--red)}.blue{color:var(--blue)}.purpleText{color:var(--purple)}
#app{max-width:1180px;margin:0 auto;padding:22px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.12em}.brand-mark{width:35px;height:35px;border-radius:12px;background:linear-gradient(145deg,#f6d887,#c88a3e);display:grid;place-items:center;color:#1d1b19;font-weight:1000;box-shadow:0 4px 20px #e8b95833}.brand small{display:block;font-size:10px;color:var(--muted);letter-spacing:.18em;font-weight:700}.pill{border:1px solid var(--line);background:#152139;color:var(--muted);border-radius:999px;padding:7px 12px;font-size:12px}
.card{background:linear-gradient(160deg,rgba(25,38,62,.96),rgba(17,27,46,.96));border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.card h2,.card h3{margin:0 0 12px}.card h2{font-size:18px}.card h3{font-size:15px}.stack{display:grid;gap:14px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.right{text-align:right}.divider{height:1px;background:var(--line);margin:14px 0}.stat{margin:10px 0}.stat-head{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;color:var(--muted)}.bar{height:9px;border-radius:99px;background:#0b1426;overflow:hidden;border:1px solid #293957}.bar span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#4a9acb,#83d3c2)}.bar.goldbar span{background:linear-gradient(90deg,#b67b3c,#f4d27c)}.bar.redbar span{background:linear-gradient(90deg,#b95162,#f18b8b)}.bar.purplebar span{background:linear-gradient(90deg,#7550ad,#c6a5ff)}
.hero{min-height:490px;display:grid;place-items:center;text-align:center;position:relative;overflow:hidden;padding:42px 22px}.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;filter:blur(2px);pointer-events:none}.hero:before{width:390px;height:390px;border:1px solid #f4c76a33;box-shadow:0 0 90px #d7a64a16;top:-170px;right:-130px}.hero:after{width:290px;height:290px;border:1px solid #7eb8ff2b;bottom:-140px;left:-100px}.hero-inner{max-width:680px;position:relative}.hero-logo{font-size:clamp(50px,11vw,100px);font-weight:1000;letter-spacing:.08em;line-height:1;background:linear-gradient(140deg,#fff6d8,#f4c76a 50%,#c88e4b);background-clip:text;color:transparent;text-shadow:0 10px 50px #f4c76a22}.hero-sub{letter-spacing:.42em;color:#c8d3e9;font-size:12px;font-weight:800;margin:14px 0 23px}.hero p{color:var(--muted);max-width:560px;margin:0 auto 26px}.hero-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.hero-actions button{min-width:170px;padding:13px 18px}.feature-strip{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:28px}.feature-strip span{font-size:11px;border:1px solid #304361;background:#142039aa;padding:6px 10px;border-radius:999px;color:#bfcee5}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.field input,.field select{width:100%;background:#0f192c;color:var(--text);border:1px solid #30415f;border-radius:10px;padding:11px 12px;outline:none}.field input:focus,.field select:focus{border-color:var(--gold);box-shadow:0 0 0 3px #f4c76a1a}.field.full{grid-column:1/-1}.checkline{display:flex;gap:9px;align-items:center;color:var(--muted);font-size:13px}.checkline input{accent-color:#e9bc61}
.game-head{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-bottom:14px}.person-title{display:flex;gap:14px;align-items:center}.avatar{width:62px;height:62px;display:grid;place-items:center;background:linear-gradient(145deg,#33496b,#1a2d4a);border:1px solid #526b8f;border-radius:18px;font-size:28px}.person-title h1{font-size:20px;margin:0}.person-title p{margin:2px 0 0;color:var(--muted);font-size:12px}.moneybox{text-align:right}.moneybox strong{display:block;color:var(--gold);font-size:25px}.hudstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.hudmini{background:#0f192c;border:1px solid #263a59;border-radius:12px;padding:9px}.hudmini span{font-size:11px;color:var(--muted);display:block}.hudmini b{font-size:16px}.nav{display:flex;gap:7px;overflow-x:auto;padding:4px 0 12px;margin-bottom:4px}.nav button{white-space:nowrap;padding:8px 12px;font-size:12px;background:#142039}.nav button.active{background:#f0c66d;color:#191d26;border-color:#f0c66d;font-weight:800}
.content-grid{display:grid;grid-template-columns:minmax(0,1.48fr) minmax(260px,.82fr);gap:14px;align-items:start}.log{max-height:430px;overflow:auto;padding-right:4px}.logitem{padding:12px 0;border-bottom:1px solid #273957}.logitem:last-child{border:0}.logitem .year{font-size:11px;color:var(--gold);font-weight:800}.logitem p{margin:4px 0;color:#d4dff0}.context-event{border-color:#477e70;box-shadow:inset 0 0 0 1px #477e7022}.eventbox{border:1px solid #7d633b;background:linear-gradient(145deg,#302b28,#202b3d);border-radius:15px;padding:15px;margin:12px 0}.eventbox h3{margin:0 0 7px;color:#ffe2a1}.choices{display:grid;gap:8px;margin-top:12px}.choices button{text-align:left;background:#1d2c44}.action-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.action-tile{text-align:left;background:#172741;padding:12px;border-radius:13px}.action-tile b{display:block}.action-tile small{color:var(--muted);font-size:11px}.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #293958}.item:last-child{border:0}.item strong{display:block}.item small{font-size:11px;color:var(--muted)}.tag{display:inline-block;border-radius:999px;padding:3px 7px;font-size:10px;background:#283a57;color:#bcd0ee;margin-left:4px}.tag.goldtag{background:#604b27;color:#ffe2a1}.tag.greentag{background:#214a40;color:#9fe6c7}.notice{padding:11px 13px;border:1px dashed #586c8b;border-radius:12px;color:#b6c6df;background:#101b30;font-size:12px}.empty{text-align:center;padding:24px 12px;color:var(--muted)}.metric{background:#111d31;border:1px solid #2a3d5e;border-radius:12px;padding:12px}.metric .value{font-size:21px;font-weight:900;color:var(--gold)}.metric small{color:var(--muted)}.dead{filter:grayscale(.35)}.modal-back{position:fixed;inset:0;background:#050a14cc;display:grid;place-items:center;padding:18px;z-index:10}.modal{width:min(620px,100%);max-height:88vh;overflow:auto;background:#15223a;border:1px solid #52688d;border-radius:18px;padding:22px;box-shadow:0 25px 90px #0009}.modal h2{margin-top:0}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#243b56;border:1px solid #6682a6;border-radius:99px;padding:10px 16px;z-index:20;box-shadow:var(--shadow);font-size:13px}.footer{text-align:center;color:#7284a3;font-size:11px;padding:25px 0 10px}
@media(max-width:850px){#app{padding:13px}.game-head{grid-template-columns:1fr}.moneybox{text-align:left}.content-grid{grid-template-columns:1fr}.hudstats{grid-template-columns:repeat(3,1fr)}}@media(max-width:560px){.formgrid,.grid2,.grid3,.grid4{grid-template-columns:1fr}.hero{min-height:430px}.person-title h1{font-size:17px}.hudstats{grid-template-columns:repeat(2,1fr)}.action-grid{grid-template-columns:1fr}.card{padding:14px}}

/* Ranking display: taller dialog and compact rows so places 1–10 fit together. */
.modal.bl-ranking-modal{width:min(780px,100%);min-height:min(88vh,760px);max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);padding:14px 18px;overflow-y:auto}
.modal.bl-ranking-modal h2{margin-bottom:7px}
.modal.bl-ranking-modal .bl-ranking-row{min-height:39px;padding:4px 0;gap:9px;align-items:center}
.modal.bl-ranking-modal .bl-ranking-row>div{min-width:0}
.modal.bl-ranking-modal .bl-ranking-row b{font-size:13px;line-height:1.25}
.modal.bl-ranking-modal .bl-ranking-row small{display:block;font-size:10px;line-height:1.25;margin-top:2px}
.modal.bl-ranking-modal .notice{padding:7px 10px;font-size:11px;line-height:1.35}
.modal.bl-ranking-modal #LC_onlineRows{padding:5px 9px}
.modal.bl-ranking-modal .empty{padding:12px 8px}
@media(max-width:560px){.modal.bl-ranking-modal{width:100%;min-height:min(90vh,700px);max-height:calc(100vh - 16px);max-height:calc(100dvh - 16px);padding:10px 12px}.modal.bl-ranking-modal .bl-ranking-row{min-height:37px;padding:3px 0}.modal.bl-ranking-modal .bl-ranking-row b{font-size:12px}.modal.bl-ranking-modal .bl-ranking-row small{font-size:9px}}

/* New-life mode selection: isolated screen, preserving the existing creation form and game UI. */
.bl-mode-wrap{max-width:850px;margin:0 auto}
.bl-mode-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:20px}
.bl-mode-card{min-height:210px;text-align:left;padding:22px;border:1px solid #405575;border-radius:16px;background:linear-gradient(155deg,#1b2c48,#121e33);color:var(--text);display:flex;flex-direction:column;gap:10px;white-space:normal}
.bl-mode-card strong{font-size:21px;color:var(--gold)}
.bl-mode-card span{font-size:13px;color:var(--muted);font-weight:400;line-height:1.7}
.bl-mode-card small{margin-top:auto;color:#d8e3f5;font-size:12px}
.bl-mode-card--normal strong{color:#a9cfff}
.bl-mode-card:hover{border-color:var(--gold);box-shadow:0 10px 28px #0003;transform:translateY(-2px)}
@media(max-width:600px){.bl-mode-grid{grid-template-columns:1fr}.bl-mode-card{min-height:160px;padding:18px}}
/* Beat Life title menu — aligned with the in-game navy / blue / gold palette */
body.beat-menu-active{overflow:hidden;background:var(--bg)}
.beat-menu{position:fixed;inset:0;z-index:5;display:grid;place-items:center;overflow:auto;padding:28px 18px;background:radial-gradient(ellipse at 50% 18%,#263a5b 0%,#17243b 34%,#0b1020 78%);isolation:isolate}
.beat-menu:before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(135deg,#79b9ff08 0%,transparent 38%,#f4c76a08 100%)}
.beat-menu-frame{width:min(100%,440px);display:flex;flex-direction:column;align-items:center;gap:0;position:relative;margin:auto;padding:30px 26px 22px;text-align:center}
.beat-menu-brand{display:flex;flex-direction:column;align-items:center;gap:19px;margin:0 0 34px}
.beat-menu-emblem{width:104px;height:104px;display:grid;place-items:center;border-radius:30px;background:linear-gradient(145deg,#1b2b46,#101a2d);border:1px solid #50617e;box-shadow:0 16px 46px #0005,inset 0 1px 0 #ffffff12,0 0 34px #f4c76a12}
.beat-menu-emblem svg{width:72px;height:72px;display:block;filter:drop-shadow(0 4px 12px #f4c76a20)}
.beat-menu-wordmark{margin:0;color:var(--text);font-size:clamp(43px,10vw,62px);font-weight:950;letter-spacing:-.065em;line-height:1}
.beat-menu-wordmark span{color:var(--gold)}
.beat-menu-rule{width:118px;height:1px;margin-top:19px;background:linear-gradient(90deg,transparent,#f4c76a99,transparent)}
.beat-menu-actions{width:min(100%,300px);display:grid;gap:11px}
.beat-menu-button{width:100%;min-height:52px;display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid #435675;border-radius:13px;padding:12px 20px;background:#17253c;color:var(--text);font-size:15px;font-weight:750;letter-spacing:.045em;box-shadow:0 5px 16px #0002;transition:background .16s,border-color .16s,transform .16s,box-shadow .16s}
.beat-menu-button:hover{background:#20324e;border-color:#7890b2;transform:translateY(-1px);box-shadow:0 8px 22px #0003}
.beat-menu-button:focus-visible{outline:3px solid #f4c76a;outline-offset:3px}
.beat-menu-button svg{width:18px;height:18px;flex:none}
.beat-menu-button--start{background:linear-gradient(135deg,#f7d98d,#e9b957);border-color:#f9dfa0;color:#182033;box-shadow:0 8px 24px #d8a74a24}
.beat-menu-button--start:hover{background:linear-gradient(135deg,#ffe5a6,#f1c66a);border-color:#ffe8b5;box-shadow:0 10px 28px #d8a74a35}
.beat-menu-titleline{margin:30px 0 0;color:#9aabc7;font-size:11px;font-weight:700;letter-spacing:.2em}
@media(max-width:560px){.beat-menu{padding:18px 14px}.beat-menu-frame{padding:22px 12px 16px}.beat-menu-brand{gap:16px;margin-bottom:28px}.beat-menu-emblem{width:92px;height:92px;border-radius:27px}.beat-menu-emblem svg{width:64px;height:64px}.beat-menu-actions{width:min(100%,320px)}.beat-menu-titleline{margin-top:25px}}

.lc-market-hud{margin-top:12px;padding-top:10px;border-top:1px solid var(--line,rgba(255,255,255,.12))}.lc-market-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px;margin-top:8px}.lc-chart-item{padding:9px;border:1px solid var(--line,rgba(255,255,255,.14));border-radius:10px;min-width:0}.lc-chart-item .green{color:#31c48d}.lc-chart-item .red{color:#ef6b73}.lc-chart-item svg{display:block;overflow:visible}@media(max-width:600px){.lc-market-grid{grid-template-columns:1fr}}

/* Beat Life account profile dock and profile details */
#BL_profileDock{position:fixed;left:16px;bottom:16px;z-index:8;max-width:min(300px,calc(100vw - 32px))}
#BL_profileDock .bl-profile-open{display:flex;align-items:center;gap:10px;max-width:100%;padding:7px 14px 7px 7px;border:1px solid #657b9d;border-radius:999px;background:linear-gradient(145deg,#1b2b46,#101a2d);color:#eef4ff;box-shadow:0 8px 28px #0008;cursor:pointer;text-align:left}
#BL_profileDock .bl-profile-avatar{width:43px;height:43px;flex:0 0 43px;display:grid;place-items:center;overflow:hidden;border-radius:50%;border:2px solid #f4c76a;background:#263c5e;color:#f4d27c;font-size:19px;font-weight:900}
#BL_profileDock .bl-profile-avatar img{width:100%;height:100%;object-fit:cover}
#BL_profileDock .bl-profile-label{min-width:0;display:flex;flex-direction:column;gap:2px}
#BL_profileDock .bl-profile-label strong{font-size:12px;max-width:185px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#BL_profileDock .bl-profile-label small{font-size:10px;color:#aebed8}
.bl-profile-head{display:flex;align-items:center;gap:15px;margin:6px 0 16px}
.bl-profile-large-avatar{width:76px;height:76px;flex:0 0 76px;display:grid;place-items:center;overflow:hidden;border:2px solid #f4c76a;border-radius:50%;background:#263c5e;color:#f4d27c;font-size:30px;font-weight:900}
.bl-profile-large-avatar img{width:100%;height:100%;object-fit:cover}
.bl-profile-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.bl-profile-action{display:inline-flex;align-items:center;justify-content:center;border:1px solid #52688d;border-radius:9px;background:#203452;color:#eef4ff;padding:7px 10px;font-size:12px;cursor:pointer}
.bl-profile-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0}
.bl-profile-stat{padding:11px;border:1px solid #304565;border-radius:12px;background:#101b30;min-width:0}
.bl-profile-stat small{display:block;color:#a8b7d0;font-size:11px;margin-bottom:5px}
.bl-profile-stat strong{font-size:17px;overflow-wrap:anywhere}
.bl-profile-lives{display:grid;gap:8px;margin-top:10px;max-height:290px;overflow:auto;padding-right:3px}
.bl-profile-life{border:1px solid #304565;border-radius:11px;background:#101b30;padding:10px 12px}
.bl-profile-life-title{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bl-profile-life-title strong{min-width:0;overflow-wrap:anywhere}
.bl-profile-life small{display:block;color:#a8b7d0;margin-top:4px;font-size:11px}
@media(max-width:560px){#BL_profileDock{left:10px;bottom:10px}#BL_profileDock .bl-profile-open{gap:7px;padding:5px 10px 5px 5px}#BL_profileDock .bl-profile-avatar{width:38px;height:38px;flex-basis:38px}#BL_profileDock .bl-profile-label strong{max-width:140px}.bl-profile-stats{gap:7px}.bl-profile-stat{padding:9px}.bl-profile-stat strong{font-size:15px}}


/* ─────────────────────────────────────────────────────────────────────────────
   Beat Life — mobile / tablet adaptation
   Presentation and touch ergonomics only. Gameplay, account, and save logic are
   intentionally unchanged.
   ─────────────────────────────────────────────────────────────────────────── */
html,body{width:100%;max-width:100%;min-width:0}
body{-webkit-text-size-adjust:100%;text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom)}
#app{width:100%;min-width:0;max-width:1180px;margin-inline:auto;padding-left:22px;padding-right:22px}

/* Small laptops, tablets, and narrow split-screen windows. */
@media(max-width:850px){
  html,body{overflow-x:clip}
  *,*::before,*::after{min-width:0}
  img,svg,video,iframe{max-width:100%}
  button,input,select{max-width:100%;touch-action:manipulation}
  button{-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  input,select{min-height:44px}
  input[type=checkbox],input[type=radio]{min-height:18px;min-width:18px;accent-color:#e9bc61}
  .field input,.field select{font-size:16px;line-height:1.35}
  .card,.metric,.notice,.eventbox,.item,.logitem,.bl-profile-life{min-width:0;overflow-wrap:anywhere}
  .card h1,.card h2,.card h3,.card p,.item strong,.item small,.logitem p{overflow-wrap:anywhere}
  .row{min-width:0;max-width:100%}
  .row>*{min-width:0;max-width:100%}
  .row.between{row-gap:8px}

const familyFirstCountries=new Set(['日本','韓国','中国','ベトナム']);
function fallbackFamilySurname(country){const pr=guardianNameProfiles[country]||guardianNameProfiles['日本'];return pick(pr.s||['佐藤','Smith']);}
function inferFamilySurname(characterName,country){
 const raw=String(characterName||'').trim();if(!raw)return fallbackFamilySurname(country);
 if(raw.includes(',')){const before=raw.split(',')[0].trim();if(before)return before;}
 const parts=raw.split(/\s+/).filter(Boolean);if(parts.length>=2)return familyFirstCountries.has(country)?parts[0]:parts.slice(-1)[0];
 // A single token is more likely a given name than an explicitly supplied family name.
 return fallbackFamilySurname(country);
}
function resolveFamilySurname(characterName,country,explicitSurname){const supplied=String(explicitSurname||'').trim();return supplied||inferFamilySurname(characterName,country);}
function formatCountryName(given,surname,country){return familyFirstCountries.has(country)?`${surname} ${given}`:`${given} ${surname}`;}
function generateGuardianNames(characterName,country,explicitSurname){
 const profile=guardianNameProfiles[country]||guardianNameProfiles['日本'];
 const surname=resolveFamilySurname(characterName,country,explicitSurname);
 const fatherGiven=pick(profile.m),motherGiven=pick(profile.f);
 return {surname,father:{name:formatCountryName(fatherGiven,surname,country),givenName:fatherGiven,sex:'男性',relation:'父（保護者）',age:pick([27,29,31,33,35,37,40,42]),closeness:70,alive:true},mother:{name:formatCountryName(motherGiven,surname,country),givenName:motherGiven,sex:'女性',relation:'母（保護者）',age:pick([24,26,28,30,32,34,36,39]),closeness:68,alive:true}};
}
function guardianNamePreview(form){
 if(!form)return;const country=form.elements.namedItem('country')?.value||'日本';const name=form.elements.namedItem('name')?.value||'';const surname=form.elements.namedItem('familySurname')?.value||'';
 const profile=guardianNameProfiles[country]||guardianNameProfiles['日本'];const familyName=resolveFamilySurname(name,country,surname);
 const order=(given)=>formatCountryName(given,familyName,country);const box=$('#guardianPreview');if(box)box.textContent=`生成例：${order(profile.m[0])} ／ ${order(profile.f[0])}　（誕生時に名前はランダム生成）`;
}

state.screen='game';tab='overview';save();render();}
function stat(label,value,cls=''){return `<div class="stat"><div class="stat-head"><span>${label}</span><b>${Math.round(value)}</b></div><div class="bar ${cls}"><span style="width:${clamp(value)}%"></span></div></div>`}
function netWorth(){const p=state.player;return p.bank+(p.savings||0)-p.debt+state.properties.reduce((s,x)=>s+x.value,0)+state.vehicles.reduce((s,x)=>s+x.value,0)+state.collectibles.reduce((s,x)=>s+x.value,0)+state.portfolio.reduce((s,x)=>s+x.units*x.price,0)+(p.business?.value||0)}

function renderCreate(){return `${topbar()}<div class="card" style="max-width:850px;margin:0 auto"><div class="row between"><div><div class="tiny gold">CREATE YOUR LIFE</div><h2 style="font-size:24px;margin:4px 0">新しい人生を設計する</h2><p class="muted" style="margin:0">まずは生まれる場所と家庭環境を決めよう。</p></div><button class="small subtle" data-action="menu">← タイトルへ</button></div><div class="divider"></div><form id="createForm"><div class="formgrid"><div class="field"><label>名前</label><input name="name" maxlength="40" placeholder="例：佐藤 はる / Emma Smith" value=""></div><div class="field"><label>性別・アイデンティティ（任意）</label><select name="sex"><option>未設定</option><option>男性</option><option>女性</option><option>ノンバイナリー</option></select></div><div class="field"><label>出身国</label><select name="country">${countries.map(c=>`<option ${c[0]==='日本'?'selected':''}>${esc(c[0])}</option>`).join('')}</select></div><div class="field"><label>保護者に使う名字（任意）</label><input name="familySurname" maxlength="40" placeholder="例：佐藤 / Smith"><small class="tiny">空欄の場合は本人の名前から推定。選択国に合った姓名順で保護者2人の名前を生成します。</small><div id="guardianPreview" class="tiny" style="margin-top:6px;color:var(--gold)">生成例：佐藤 悠人 ／ 佐藤 陽菜</div></div><div class="field"><label>生まれる都市</label><input name="city" placeholder="空欄なら代表都市"></div><div class="field"><label>家庭環境</label><select name="family"><option value="poor">質素な家庭</option><option value="middle" selected>一般的な家庭</option><option value="wealthy">裕福な家庭</option><option value="royal">名家・資産家</option></select></div><div class="field"><label>能力設定</label><select name="stats"><option value="random">ランダム（おすすめ）</option><option value="balanced">バランス型</option><option value="genius">知性型</option><option value="athlete">運動型</option></select></div><div class="field full"><div class="notice">選択したプレイモード：<b>${creationGodMode?'🪄 GodMode':'🌱 通常モード'}</b>　<button type="button" class="small subtle" data-action="backMode">変更する</button></div></div></div><div class="divider"></div><div class="row between"><span class="tiny">追加コン function renderHud(){const p=state.player;const age=p.age===0?'0歳（新生児）':p.age+'歳';return `<div class="game-head"><div class="card"><div class="person-title"><div class="avatar">${p.alive?'👤':'🕊️'}</div><div><h1>${esc(p.name)} <span class="tag">${age}</span></h1><p>${esc(p.country)}・${esc(p.city)}　｜　${state.year}年　｜　${esc(p.sex)}</p><p>${p.job?esc(p.job.name):p.age<6?'幼児':p.age<16?'学生':p.retired?'引退':'職業未定'} ${p.partner?'・パートナーあり':''}</p></div></div><div class="hudstats"><div class="hudmini"><span>💰 所持金</span><b>${money(p.bank)}</b></div><div class="hudmini"><span>💼 年収</span><b>${money(p.salary)}</b></div><div class="hudmini"><span>🏦 純資産</span><b>${money(netWorth())}</b></div></div></div><div class="card"><div class="row between"><b>人生ステータス</b><span class="tiny">${p.alive?'生存中':'人生終了'}</span></div>${stat('健康',p.health,'greenbar')}${stat('幸福',p.happiness,'goldbar')}${stat('知性',p.smarts)}${stat('容姿',p.looks,'purplebar')}${stat('体力',p.fitness,'greenbar')}<div class="row between tiny"><span>ストレス ${Math.round(p.stress)}%</span><span>名声 ${Math.round(p.fame)}%</span><span>カルマ ${Math.round(p.karma)}%</span></div></div></div>`}
function renderLog(limit=8){return `<div class="card"><div class="row between"><h2>📖 人生の記録</h2><span class="tiny">最新の出来事</span></div><div class="log">${state.log.slice(0,limit).map(x=>`<div class="logitem"><div class="year">${x.year}年 · ${x.age}歳</div><p>${esc(x.text)}</p></div>`).join('')||'<div class="empty">まだ記録はありません。</div>'}</div></div>`}
function renderPending(){if(!state.pending)return '';const e=state.pending;return `<div class="eventbox"><div class="tiny gold">LIFE EVENT · ${state.year}年</div><h3>${esc(e.title)}</h3><div>${esc(e.text)}</div><div class="choices">${e.options.map((o,i)=>`<button data-action="choice" data-index="${i}">${esc(o.label)} <span class="tiny">→</span></button>`).join('')}</div></div>`}
function renderOverview(){const p=state.player;return `<div class="content-grid"><div class="stack">${renderPending()}<div class="card"><div class="row between"><h2>人生を進める</h2><span class="tiny">1回で1年が経過</span></div><p class="muted">年齢を重ねると、健康・学業・仕事・資産・人間関係が変化し、ランダムな出来事が発生します。</p><div class="row"><button class="primary" data-action="age" ${(!p.alive||state.pending)?'disabled':''}>▶ 1年歳を取る</button><button data-action="activity">自由行動</button><button class="subtle" data-action="timeline">人生年表</button></div></div>${renderLog()}</div><div class="stack"><div class="card"><h2>🧭 いまの状況</h2><div class="item"><div><strong>住まい</strong><small>${state.properties[0]?esc(state.properties[0].name):'家族と同居／住居未所有'}</small></div><span>🏠</span></div><div class="item"><div><strong>学歴</strong><small>${p.degree?esc(p.degree)+' 学位':p.age<18?'在学中':'最終学歴なし'}</small></div><span>🎓</span></div><div class="item"><div><strong>家族</strong><small>パートナー ${p.partner?'1人':'なし'} ・ 子ども ${p.children.length}人</small></div><span>👪</span></div><div class="item"><div><strong>所有資産</strong><small>不動産 ${state.properties.length}件 / 車・船 ${state.vehicles.length}台</small></div><span>💎</span></div></div><div class="card"><h2>🎯 人生の目標</h2><div class="tiny">${esc(state.challenge.name)}</div><div class="bar goldbar" style="margin:9px 0"><span style="width:${clamp(state.challenge.progress)}%"></span></div><small class="muted">進行度 ${Math.round(state.challenge.progress)}%</small></div><div class="card"><h2>⚡ クイックアクション</h2><div class="action-grid"><button class="action-tile" data-action="gym">🏋️<b>運動する</b><small>体力・健康を上げる</small></button><button class="action-tile" data-action="study">📚<b>勉強する</b><small>知性を伸ばす</small></button><button class="action-tile" data-action="social">🤝<b>交流する</b><small>幸福・人間関係</small></button><button class="action-tile" data-action="work">💼<b>働く</b><small>臨時収入を得る</small></button></div></div></div></div>`}
function renderRelations(){const p=state.player;const rels=[...p.family,...(p.partner?[p.partner]:[]),...p.children,...p.friends];return `<div class="content-grid"><div class="card"><div class="row between"><h2>👥 人間関係</h2><button class="small" data-action="meet">新しい人と出会う</button></div>${rels.length?rels.map((r,i)=>`<div class="item"><div><strong>${esc(r.name)} <span class="tag">${esc(r.relation)}</span></strong><small>親密度 ${r.closeness||50}% ${r.age!=null?' · '+r.age+'歳':''}</small></div><div class="row"><button class="small" data-action="rel" data-index="${i}">交流</button></div></div>`).join(''):'<div class="empty">まだ登録された人間関係はありません。</div>'}<div class="divider"></div><div class="row"><button data-action="date">💕 デートする</button><button data-action="marry" ${(!p.partner||p.partner.relation==='配偶者')?'disabled':''}>💍 結婚する</button><button data-action="child" ${(!p.partner||p.age<18)?'disabled':''}>👶 子どもを迎える</button><button class="danger" data-action="breakup" ${!p.partner?'disabled':''}>関係を解消</button></div></div><div class="stack"><div class="card"><h2>家族計画</h2><div class="metric"><div class="value">${p.children.length}</div><small>子ども</small></div><p class="tiny">子どもがいる場合、人生の終わりに次世代としてプレイを続けられます。家族への贈与や遺産も引き継がれます。</p></div><div class="card"><h2>人間関係のヒント</h2><p class="tiny">交流を重ねると親密度が上がります。無視や対立が続くと関係が悪化し、別れ・疎遠などのイベントにつながることがあります。</p></div></div></div>`}
function renderCareer(){const p=state.player;let content='';if(p.age<16){content=`<div class="notice">現在は学生です。勉強や部活動で能力を高め、将来の進学・就職に備えよう。</div><div class="row" style="margin-top:12px"><button data-action="study">📚 勉強する</button><button data-action="club">🏅 部活動に参加</button></div>`}else if(p.job){content=`<div class="metric"><div class="tiny">現在の職業</div><div class="value">${esc(p.job.name)}</div><small>${esc(p.job.sector)} · ${p.rank+1}段階目</small></div><div class="grid3" style="margin-top:12px"><div class="metric"><div class="value">${money(p.salary)}</div><small>年収</small></div><div class="metric"><div class="value">${p.experience}</div><small>経験年数</small></div><div class="metric"><div class="value">${Math.round(p.fame)}%</div><small>知名度</small></div></div><div class="row" style="margin-top:12px"><button data-action="work">💼 仕事に励む</button><button data-action="quit" class="danger">退職する</button><button data-action="joblist">転職を探す</button></div>`}else{content=`<div class="notice">現在、定職に就いていません。学歴・知性・年齢・運によって採用される職業が変わります。</div><div class="row" style="margin-top:12px"><button class="primary" data-action="joblist">求人を探す</button><button data-action="business">会社を設立</button></div>`}return `<div class="content-grid"><div class="card"><h2>💼 キャリア</h2>${content}<div class="divider"></div><h3>専門キャリア</h3><p class="tiny">芸能、スポーツ、映画制作、音楽、政治、情報機関、格闘技、裏社会などの専門ルートも選択可能。</p><div class="grid2">${['俳優・映画監督','歌手・音楽プロデューサー','プロスポーツ選手','政治家','諜報員','格闘家','マフィア構成員','プロゲーマー'].map(x=>`<div class="item"><strong>${x}</strong><span class="tag greentag">解放済み</span></div>`).join('')}</div></div><div class="stack"><div class="card"><h2>🎓 学歴</h2><div class="metric"><div class="value">${p.degree?esc(p.degree):p.education>=3?'大学卒業':p.education===2?'大学在学':'基礎教育'}</div><small>進学レベル ${p.education}/3</small></div><button style="margin-top:10px" data-action="education">教育メニュー</button></div><div class="card"><h2>キャリア評価</h2>${stat('知性',p.smarts)}${stat('経験',clamp(p.experience*4))}${stat('名声',p.fame,'goldbar')}</div></div></div>`}
function renderEducation(){const p=state.player;return `<div class="content-grid"><div class="card"><h2>🎓 教育・進学</h2><div class="item"><div><strong>現在の段階</strong><small>${p.age<6?'未就学':p.age<12?'小学校':p.age<16?'中学校':p.age<18?'高校':p.education===3?'大学卒業':p.education===2?'大学在学':'進学可能'}</small></div><span class="tag">${p.age}歳</span></div><p class="muted">学業成績は知性と勉強習慣で変わります。進学すると専門職への道が開けますが、学費や奨学金も考える必要があります。</p><div class="row"><button data-action="study">📚 勉強する</button><button data-action="university" ${p.age<18||p.education>=2?'disabled':''}>大学へ進学</button><button data-action="graduate" ${p.education!==2?'disabled':''}>卒業する</button></div><div class="divider"></div><h3>専攻を選ぶ</h3><div class="grid3">${degrees.map(d=>`<button class="small subtle" data-action="degree" data-value="${esc(d)}">${esc(d)}</button>`).join('')}</div></div><div class="card"><h2>学業ステータス</h2>${stat('知性',p.smarts)}<div class="metric"><div class="value">${p.education}/3</div><small>教育レベル</small></div><p class="tiny">大学進学には一定の知性と学費が必要。成績や家庭環境によって奨学金を得られる場合があります。</p></div></div>`}
function renderAssets(){const p=state.player;return `<div class="content-grid"><div class="stack"><div class="card"><div class="row between"><h2>🏠 不動産・固定資産</h2><button class="small" data-action="propertyshop">物件を探す</button></div>${state.properties.length?state.properties.map((x,i)=>`<div class="item"><div><strong>${esc(x.name)} <span class="tag">${esc(x.type)}</span></strong><small>評価額 ${money(x.value)} · 年間家賃 ${money(x.rent)} · ${x.rented?'賃貸中':'自己使用'}</small></div><div class="row"><button class="small" data-action="toggleRent" data-index="${i}">${x.rented?'入居':'貸し出す'}</button><button class="small danger" data-action="sellProperty" data-index="${i}">売却</button></div></div>`).join(''):'<div class="empty">不動産を所有していません。</div>'}</div><div class="card"><div class="row between"><h2>🚘 車両・乗り物</h2><button class="small" data-action="vehicleshop">購入する</button></div>${state.vehicles.length?state.vehicles.map((x,i)=>`<div class="item"><div><strong>${esc(x.name)}</strong><small>${esc(x.type)} · 評価額 ${money(x.value)}</small></div><button class="small danger" data-action="sellVehicle" data-index="${i}">売却</button></div>`).join(''):'<div class="empty">車両・乗り物はありません。</div>'}</div><div class="card"><div class="row between"><h2>💎 コレクション・貴重品</h2><button class="small" data-action="collectshop">購入する</button></div>${state.collectibles.length?state.collectibles.map((x,i)=>`<div class="item"><div><strong>${esc(x.name)}</strong><small>${esc(x.type)} · 評価額 ${money(x.value)}</small></div><button class="small danger" data-action="sellCollect" data-index="${i}">売却</button></div>`).join(''):'<div class="empty">コレクションはありません。</div>'}</div></div><div class="stack"><div class="card"><h2>資産サマリー</h2><div class="metric"><div class="value">${money(netWorth())}</div><small>推定純資産</small></div><div class="item"><strong>所持金</strong><b>${money(p.bank)}</b></div><div class="item"><strong>銀行預金</strong><b>${money(p.savings||0)}</b></div><div class="tiny">銀行預金の年利：1.5% · ローン金利：年6%</div><div class="item"><strong>借金</strong><b class="red">${money(p.debt)}</b></div><div class="item"><strong>不動産</strong><b>${money(state.properties.reduce((s,x)=>s+x.value,0))}</b></div><div class="item"><strong>動産</strong><b>${money(state.vehicles.reduce((s,x)=>s+x.value,0)+state.collectibles.reduce((s,x)=>s+x.value,0))}</b></div></div><div class="card"><h2>銀行</h2><div class="row"><button data-action="deposit">預金する</button><button data-action="withdraw">引き出す</button><button data-action="loan">借入</button></div></div></div></div>`}
function renderMarket(){return `<div class="content-grid"><div class="card"><div class="row between"><h2>📈 投資ポートフォリオ</h2><button class="small" data-action="marketshop">投資する</button></div><p class="muted">株式・暗号資産・金・債券などに投資できます。価格は毎年変動し、利益も損失も発生します。</p>${state.portfolio.length?state.portfolio.map((x,i)=>`<div class="item"><div><strong>${esc(x.name)} <span class="tag">${esc(x.kind)}</span></strong><small>${x.units.toFixed(2)}口 × ${money(x.price)} · 取得単価 ${money(x.cost)}</small></div><div class="right"><b>${money(x.units*x.price)}</b><br><button class="small" data-action="sellInvest" data-index="${i}">売却</button></div></div>`).join(''):'<div class="empty">投資商品を保有していません。</div>'}</div><div class="stack"><div class="card"><h2>投資スタイル</h2><div class="metric"><div class="value">${money(state.portfolio.reduce((s,x)=>s+x.units*x.price,0))}</div><small>現在の投資評価額</small></div><div class="tiny" style="margin-top:12px">市場は予測できません。複数商品に分散し、余裕資金で投資することができます。</div></div><div class="card"><h2>経済ニュース</h2><p class="tiny">市場の景気、産業トレンド、金利、技術革新などが価格に影響します。価格変動は年齢を進めると更新されます。</p></div></div></div>`}

function allocatePayout(list,amount,relation,childStart){if(!list.length)return amount;const each=Math.floor(amount/list.length);let rest=amount-each*list.length;list.forEach((person,i)=>{const row={name:person.name,relation:person.relation||relation,amount:each+(i===0?rest:0)};if(childStart)row.childIndex=person.index;state.lastInheritance.payouts.push(row)});return 0}
function settleInheritance(){const p=state.player;const estate=Math.max(0,Math.round(netWorth()));const w=p.will||{mode:'balanced',charityPercent:0,heirIndex:0};const record={deceased:p.name,year:state.year,estate,mode:w.mode||'balanced',payouts:[]};state.lastInheritance=record;const partner=p.partner?[p.partner]:[];const children=p.children.map((c,i)=>({...c,index:i}));const family=(p.family||[]).filter(f=>f.alive!==false);const childPeople=children.map(c=>({name:c.name,relation:'子ども',index:c.index}));const fallback=()=>{if(partner.length)return allocatePayout(partner,estate,'パートナー',false);if(childPeople.length)return allocatePayout(childPeople,estate,'子ども',true);if(family.length)return allocatePayout(family,estate,'親族',false);record.payouts.push({name:'公的基金',relation:'寄付・未請求財産',amount:estate});return 0};const balanced=(amount)=>{if(partner.length&&childPeople.length){const partnerPart=Math.floor(amount*.5);allocatePayout(partner,partnerPart,'パートナー',false);allocatePayout(childPeople,amount-partnerPart,'子ども',true)}else if(partner.length)allocatePayout(partner,amount,'パートナー',false);else if(childPeople.length)allocatePayout(childPeople,amount,'子ども',true);else if(family.length)allocatePayout(family,amount,'親族',false);else record.payouts.push({name:'公的基金',relation:'寄付・未請求財産',amount})};
 if(record.mode==='chosenChild'&&childPeople[w.heirIndex]){allocatePayout([childPeople[w.heirIndex]],estate,'子ども',true)}else if(record.mode==='children'&&childPeople.length){allocatePayout(childPeople,estate,'子ども',true)}else if(record.mode==='partner'&&partner.length){allocatePayout(partner,estate,'パートナー',false)}else if(record.mode==='charity'){const donation=Math.round(estate*clamp(Number(w.charityPercent)||20,5,80)/100);if(donation>0)record.payouts.push({name:'慈善団体',relation:'寄付',amount:donation});balanced(estate-donation)}else if(record.mode==='partner'&&!partner.length&&childPeople.length){allocatePayout(childPeople,estate,'子ども',true)}else if(record.mode==='children'&&!childPeople.length&&partner.length){allocatePayout(partner,estate,'パートナー',false)}else if(record.mode==='chosenChild'&&!childPeople.length){balanced(estate)}else if(record.mode==='balanced'){balanced(estate)}else if(record.mode==='children'&&!childPeople.length&&!partner.length){fallback()}else if(record.mode==='partner'&&!partner.length&&!childPeople.length){fallback()}else if(record.mode==='chosenChild'&&!childPeople.length&&!partner.length){fallback()}else{balanced(estate)}
 const total=record.payouts.reduce((sum,x)=>sum+x.amount,0);if(total<estate)record.payouts.push({name:'未指定分',relation:'保留財産',amount:estate-total});record.payouts=record.payouts.filter(x=>x.amount>0);state.inheritanceLedger=state.inheritanceLedger||[];state.inheritanceLedger.unshift(JSON.parse(JSON.stringify(record)));state.inheritanceLedger=state.inheritanceLedger.slice(0,30);addLog(`遺産${money(estate)}の相続分配を確定した。${record.payouts.map(x=>`${x.name}：${money(x.amount)}`).join('、')}`);return record}
function die(){const p=state.player;if(!p.alive)return;const inheritance=settleInheritance();p.alive=false;let r=p.fame>60?'名声':netWorth()>2000000?'富豪':p.children.length>2?'家族':p.age>85?'長寿':p.karma>80?'善行':'平凡';state.ribbons.unshift(r+'の人生');addLog(`${p.name}は${p.age}歳で亡くなった。人生を振り返る記録が残された。`);save();render();}
function act(type){const p=state.player;if(!p.alive)return;switch(type){case'library':if(p.age<6){toast('図書館は6歳以上から利用できます');return}p.smarts=clamp(p.smarts+5);p.happiness=clamp(p.happiness+2);p.stress=clamp(p.stress-3);p.libraryVisits=(p.libraryVisits||0)+1;addLog('図書館で本を読み、知識を深めた。');break;case'salon':if(p.age<12){toast('サロンは12歳以上から利用できます');return}{const fee=Math.round(550*p.cost);if(p.bank<fee){toast('サロンの料金が足りません');return}p.bank-=fee;p.looks=clamp(p.looks+5);p.happiness=clamp(p.happiness+4);addLog(`美容室・サロンで身だしなみを整えた（${money(fee)}）。`);}break;case'spa':if(p.age<16){toast('スパは16歳以上から利用できます');return}{const fee=Math.round(1800*p.cost);if(p.bank<fee){toast('スパの料金が足りません');return}p.bank-=fee;p.health=clamp(p.health+3);p.happiness=clamp(p.happiness+8);p.stress=clamp(p.stress-15);addLog(`スパ・エステで心身を休めた（${money(fee)}）。`);}break;case'cinema':if(p.age<6){toast('映画館は6歳以上から利用できます');return}{const fee=Math.round(850*p.cost);if(p.bank<fee){toast('映画館の料金が足りません');return}p.bank-=fee;p.happiness=clamp(p.happiness+7);p.stress=clamp(p.stress-4);if(p.partner)p.partner.closeness=clamp((p.partner.closeness||50)+5);addLog(`${pick(['話題のコメディ','感動的なドラマ','壮大なSF作品','サスペンス映画','アニメーション作品'])}を映画館で鑑賞した（${money(fee)}）。`);}break;case'nightclub':if(p.age<18){toast('ナイトクラブは18歳以上から利用できます');return}{const fee=Math.round(1600*p.cost);if(p.bank<fee){toast('入場料が足りません');return}p.bank-=fee;p.happiness=clamp(p.happiness+8);p.stress=clamp(p.stress+2);let met='';if(chance(42)){const friend={name:pick(['ユウト','ミナ','レオ','カレン','アヤ','マックス','サラ']),relation:'ナイトクラブで出会った友人',age:p.age,closeness:45};p.friends.push(friend);met=`${friend.name}と知り合った。`}addLog(`ナイトクラブで夜を楽しんだ（${money(fee)}）。${met}`);}break;case'gym':p.fitness=clamp(p.fitness+8);p.health=clamp(p.health+4);p.stress=clamp(p.stress-2);addLog('ジムでトレーニングを行った。');break;case'doctor':p.health=clamp(p.health+16);p.bank-=Math.min(p.bank,Math.round(800*p.cost));addLog('健康診断を受け、体調管理をした。');break;case'meditate':p.stress=clamp(p.stress-12);p.happiness=clamp(p.happiness+4);addLog('瞑想と休息で心を整えた。');break;case'vacation':{const fee=Math.round(2400*p.cost);if(p.bank<fee){toast('旅行費用が足りません');return}p.bank-=fee;p.happiness=clamp(p.happiness+12);p.stress=clamp(p.stress-12);addLog(`旅行に出かけ、新しい景色を楽しんだ（${money(fee)}）。`);break;}case'hobby':p.happiness=clamp(p.happiness+9);p.smarts=clamp(p.smarts+2);addLog('趣味の時間を楽しんだ。');break;case'lottery':if(p.bank<50){toast('宝くじを買う資金が足りません');return}p.bank-=50;if(chance(.4)){let win=Math.round(50+Math.random()*400);p.bank+=win;addLog(`宝くじが当たり、${money(win)}を獲得した。`)}else addLog('宝くじは外れた。');break;case'casino':if(p.bank<100){toast('遊ぶ資金が足りません');return}let bet=Math.min(p.bank,500);p.bank-=bet;if(chance(42)){p.bank+=bet*2;addLog(`ゲームに勝ち、${money(bet)}の利益を得た。`)}else{p.happiness-=4;addLog(`${money(bet)}を失った。ギャンブルはほどほどに。`)}break;case'social':p.happiness=clamp(p.happiness+6);if(p.friends[0])p.friends[0].closeness=clamp(p.friends[0].closeness+8);addLog('友人と過ごし、交流を深めた。');break;case'donate':if(p.bank<100){toast('寄付できる資金がありません');return}p.bank-=Math.min(p.bank,500);p.karma=clamp(p.karma+8);p.happiness=clamp(p.happiness+4);addLog('慈善団体へ寄付を行った。');break;case'study':p.smarts=clamp(p.smarts+7);p.stress=clamp(p.stress+2);addLog('勉強に集中した。知性が上がった。');break;case'club':p.fitness=clamp(p.fitness+4);p.friends.push({name:pick(['はる','そうた','ゆい','メイ']),relation:'部活仲間',age:p.age,closeness:50});addLog('部活動に参加し、仲間ができた。');break;case'work':if(!p.job){p.bank+=Math.round(500*p.cost);addLog('単発の仕事をして臨時収入を得た。')}else{p.bank+=Math.round(p.salary*.04);p.stress=clamp(p.stress+3);addLog('追加の仕事をこなし、臨時収入を得た。')}break;case'pet':if(p.bank<200){toast('ペットを迎える資金が足りません');return}p.bank-=200;p.pets.push(pick(['犬','猫','うさぎ','鳥','亀']));p.happiness=clamp(p.happiness+8);addLog(`新しいペット（${p.pets[p.pets.length-1]}）を家族に迎えた。`);break;case'hair':p.looks=clamp(p.looks+3);p.bank-=Math.min(p.bank,Math.round(120*p.cost));addLog('ヘアスタイルを変えて気分転換した。');break;case'relationship':p.happiness=clamp(p.happiness+4);p.karma=clamp(p.karma+3);addLog('人間関係について考え、相手の立場を理解しようとした。');break;case'retire':if(p.age<55){toast('引退には通常55歳以上が必要です');return}p.retired=true;p.pension=Math.round(p.salary*.32);p.job=null;p.salary=0;addLog(`仕事を引退し、年金として年間${money(p.pension)}を受け取ることにした。`);break;case'will':willModal();return;case'emigrate':showCountryModal();return;case'date':if(p.age<16){toast('恋愛・デートは16歳以上から');return}if(p.partner){p.partner.closeness=clamp(p.partner.closeness+10);p.happiness=clamp(p.happiness+7);addLog(`${p.partner.name}とデートを楽しんだ。`)}else{p.partner={name:pick(['あおい','蓮','美月','ソフィア','リアム','エマ','湊']),relation:'恋人',age:p.age,closeness:65};p.happiness=clamp(p.happiness+7);addLog(`${p.partner.name}と出会い、交際を始めた。`)}break;case'crime':crime();return;case'education':tab='education';render();return;case'activity':tab='activities';render();return;default:return;}p.health=clamp(p.health);p.happiness=clamp(p.happiness);p.stress=clamp(p.stress);save();render();}
function crime(){const p=state.player;showModal('犯罪を選択',`<p class="muted">実行する犯罪を選んでください。結果は確率で決まり、発覚すると罰金・補導・服役などのリスクがあります。</p><div class="stack"><button class="danger" data-modal-action="commitCrime" data-crime-type="shoplifting" ${p.age<12?'disabled':''}>🛒 万引き<small class="muted">12歳以上 · 少額の利益／発覚時は補導・罰金など</small></button><button class="danger" data-modal-action="commitCrime" data-crime-type="burglary" ${p.age<18?'disabled':''}>🏚️ 空き巣<small class="muted">18歳以上 · 大きな利益の可能性／重い刑事罰</small></button><button class="danger" data-modal-action="commitCrime" data-crime-type="fraud" ${p.age<18?'disabled':''}>💳 詐欺<small class="muted">18歳以上 · 金銭的利益／賠償・服役の可能性</small></button></div><div class="notice" style="margin-top:12px">捜査の警戒度：${Math.round(state.crimeHeat||0)}% · 犯罪歴：${p.crimeRecord||0}回</div>`)}
function performCrime(type){const p=state.player;const crimes={shoplifting:{name:'万引き',minAge:12,base:62,detection:24,reward:[250,1800],fine:900,prison:[0,1]},burglary:{name:'空き巣',minAge:18,base:42,detection:43,reward:[8000,60000],fine:8500,prison:[1,7]},fraud:{name:'詐欺',minAge:18,base:48,detection:38,reward:[4000,38000],fine:6500,prison:[1,5]}};const c=crimes[type];if(!c)return;if(p.age<c.minAge){toast(`${c.minAge}歳以上から選択できます`);return}const heat=clamp(Number(state.crimeHeat)||0);const success=chance(clamp(c.base+p.smarts*.12+p.karma*.05-heat*.18,5,88));const detected=chance(clamp(c.detection+heat*.62+(p.crimeRecord||0)*6-(state.powers.assassin?18:0),5,92));state.crimeHeat=clamp(heat+pick([8,12,16,20]));if(detected){p.crimeRecord=(p.crimeRecord||0)+1;p.karma=clamp(p.karma-12);const fine=Math.round(c.fine*p.cost*(1+Math.random()*.5));const paid=Math.min(p.bank,fine);p.bank-=paid;const remaining=fine-paid;if(remaining>0)p.debt+=remaining;let sentence='';if(p.age<18&&type==='shoplifting'){sentence='警察に補導され、保護者から厳しく注意された。';p.happiness=clamp(p.happiness-12)}else if(type==='shoplifting'&&p.crimeRecord===1){sentence='店舗で発覚し、罰金と厳重注意を受けた。';}else{p.prison=Math.round(c.prison[0]+Math.random()*(c.prison[1]-c.prison[0]));sentence=`発覚して${p.prison}年間の服役となった。`;}addLog(`${c.name}が発覚。${money(fine)}の罰金・賠償が発生した。${sentence}`);if(success)addLog('利益を得る前に発覚し、計画は失敗した。');}else if(success){const gain=Math.round((c.reward[0]+Math.random()*(c.reward[1]-c.reward[0]))*p.cost);p.bank+=gain;p.karma=clamp(p.karma-8);state.blackMarketRep=(state.blackMarketRep||0)+1;addLog(`${c.name}が発覚せず、${money(gain)}を得た。ただし捜査の警戒度が上がった。`);}else{p.karma=clamp(p.karma-4);p.stress=clamp(p.stress+8);addLog(`${c.name}は失敗し、利益を得られなかった。警戒度が上がった。`);}save();render();}
function jobList(){const p=state.player;const eligible=jobs.filter(j=>p.age>=j.age&&p.smarts>=Math.max(15,j.req-22)&&(!j.edu||p.education>=j.edu));showModal('求人一覧',`<p class="tiny">学歴・能力・年齢などの条件を満たす職業を表示しています。</p>${eligible.map((j,i)=>`<div class="item"><div><strong>${esc(j.name)}</strong><small>${esc(j.sector)} · 基本年収 ${money(j.salary||30000)} · 必要知性 ${j.req}</small></div><button class="small primary" data-modal-action="apply" data-index="${jobs.indexOf(j)}">応募</button></div>`).join('')||'<div class="empty">現在応募できる求人はありません。勉強や経験を積みましょう。</div>'}`)}
function showModal(title,body){modal=true;const old=$('#modal');if(old)old.remove();document.body.insertAdjacentHTML('beforeend',`<div class="modal-back" id="modal"><div class="modal"><div class="row between"><h2>${title}</h2><button class="small" data-modal-action="close">✕</button></div>${body}</div></div>`)}
function closeModal(){const m=$('#modal');if(m)m.remove();modal=null;}
function propertyShop(){const list=homes.map((h,i)=>`<div class="item"><div><strong>${h[0]}</strong><small>${h[1]} · 購入価格 ${money(h[2]*state.player.cost)} · 年間家賃 ${money(h[3]*state.player.cost)}</small></div><button class="small primary" data-modal-action="buyhome" data-index="${i}">購入</button></div>`).join('');showModal('不動産マーケット',`<p class="tiny">立地・種類・市場によって価格は変わります。賃貸に出すと毎年家賃収入を得られます。</p>${list}`)}
function vehicleShop(){showModal('乗り物を購入',vehicles.map((v,i)=>`<div class="item"><div><strong>${v[0]}</strong><small>${v[1]} · ${money(v[2]*state.player.cost)}</small></div><button class="small primary" data-modal-action="buyvehicle" data-index="${i}">購入</button></div>`).join(''))}
function collectShop(){showModal('コレクションマーケット',collectables.map((v,i)=>`<div class="item"><div><strong>${v[0]}</strong><small>${v[1]} · ${money(v[2]*state.player.cost)}</small></div><button class="small primary" data-modal-action="buycollect" data-index="${i}">購入</button></div>`).join(''))}
function marketShop(){const list=[['国内株式','株式',2400],['テクノロジー株','株式',5600],['暗号資産','暗号資産',1800],['金','金',7200],['国債ファンド','債券',3100],['再生エネルギーETF','株式',1900],['不動産投資信託','REIT',2800]];showModal('投資商品を選択',list.map((v,i)=>`<div class="item"><div><strong>${v[0]}</strong><small>${v[1]} · 1口 ${money(v[2]*state.player.cost)}</small></div><button class="small primary" data-modal-action="buyinvest" data-index="${i}">購入</button></div>`).join(''))}
function applyJob(index){const j=jobs[index],p=state.player;if(!j)return;const score=p.smarts*.45+p.education*12+p.looks*.1+p.experience*2;if(chance(clamp(25+score-j.req,5,94))){p.job={...j};if(state.powers.hollywood&&j.fame)p.fame=clamp(p.fame+35);p.salary=Math.round((j.salary||42000)*p.cost*(.85+Math.random()*.3));p.rank=0;p.experience=0;p.retired=false;addLog(`${j.name}に採用された。新しいキャリアが始まる。`);toast('採用されました！')}else{p.happiness=clamp(p.happiness-3);addLog(`${j.name}の採用試験に落ちた。経験を積んで再挑戦しよう。`);toast('今回は不採用でした')}closeModal();save();render()}
function showCountryModal(){showModal('移住先を選択',countries.map((c,i)=>`<div class="item"><div><strong>${c[0]}</strong><small>代表都市：${c[1]} · 生活コスト指数 ${c[4].toFixed(2)}</small></div><button class="small primary" data-modal-action="emigrate" data-index="${i}">移住</button></div>`).join(''))}
function university(){const p=state.player;if(p.age<18){toast('大学進学は18歳から');return}if(p.education>=2){toast('すでに大学に在学・卒業しています');return}const fee=Math.round(12000*p.cost);if(p.bank<fee&&p.smarts<85){toast('学費または奨学金条件が足りません');return}if(p.smarts>=85){p.bank=Math.max(0,p.bank-Math.round(fee*.25));addLog('成績優秀で奨学金を獲得し、大学へ進学した。')}else{p.bank=Math.max(0,p.bank-fee);addLog('大学へ進学した。学費を支払い、専門的な学びを始めた。')}p.education=2;p.stress=clamp(p.stress+5);save();render()}
function graduate(){const p=state.player;if(p.education!==2)return;p.education=3;p.smarts=clamp(p.smarts+8);if(!p.degree)p.degree=pick(degrees);addLog(`${p.degree}を専攻し、大学を卒業した。`);save();render()}
function createBusiness(){const p=state.player;if(p.age<18){toast('会社設立は18歳から');return}if(p.business){toast('すでに事業を経営しています');return}const fee=Math.round(18000*p.cost);if(p.bank<fee){toast(`設立資金として${money(fee)}必要です`);return}showModal('会社を設立',`<p class="tiny">事業名を決めて経営を始めよう。初期費用 ${money(fee)}</p><div class="field"><label>会社名</label><input id="bizName" maxlength="30" placeholder="例：クロニクル・テック"></div><div class="field" style="margin-top:10px"><label>業種</label><select id="bizType"><option>テクノロジー</option><option>飲食・小売</option><option>不動産</option><option>エンターテインメント</option><option>製造・物流</option></select></div><button class="primary" style="margin-top:14px" data-modal-action="startbiz">起業する</button>`)}
function godEdit(){const p=state.player;showModal('神モード：人物編集',`<p class="tiny">能力・年齢・資金を直接編集できます。設定変更はこのセーブデータに反映されます。</p><div class="formgrid"><div class="field"><label>名前</label><input id="edit_name" value="${esc(p.name)}" maxlength="24"></div><div class="field"><label>年齢</label><input id="edit_age" type="number" min="0" max="112" value="${p.age}"></div>${[['health','健康'],['happiness','幸福'],['smarts','知性'],['looks','容姿'],['fitness','体力'],['karma','カルマ'],['fame','名声'],['bank','預金']].map(([k,l])=>`<div class="field"><label>${l}</label><input id="edit_${k}" type="number" value="${Math.round(p[k])}"></div>`).join('')}</div><button class="primary" style="margin-top:14px" data-modal-action="savegod">変更を適用</button>`)}
function rewind(){if(!state.lastSnapshots.length){toast('巻き戻せる過去の記録がありません');return}const snap=JSON.parse(state.lastSnapshots.pop());state.player=snap.player;state.year=snap.year;state.properties=snap.properties;state.vehicles=snap.vehicles;state.collectibles=snap.collectibles;state.portfolio=snap.portfolio;state.business=snap.business;state.pending=null;addLog('時間を巻き戻し、直前の年をやり直した。');save();render();toast('時間を巻き戻しました')}
function choiceAction(id){const p=state.player;switch(id){case'cult':if(state.cult){toast('すでに団体を運営しています');return}state.cult={name:'新しい共同体',members:3,trust:45,wealth:0};addLog('新しいコミュニティを立ち上げた。');break;case'racing':if(p.age<16){toast('レースは16歳から参加できます');return}if(chance(p.fitness*.6)){const prize=Math.round((2500+Math.random()*18000)*p.cost);p.bank+=prize;p.fame=clamp(p.fame+6);addLog(`レースで好成績を収め、賞金${money(prize)}を獲得した。`)}else{p.fitness=clamp(p.fitness+2);addLog('レースで結果を残せなかったが、経験を積んだ。')}break;case'outdoor':p.fitness=clamp(p.fitness+6);p.happiness=clamp(p.happiness+6);p.health=clamp(p.health+2);addLog('キャンプや登山などのアウトドア活動を楽しんだ。');break;case'vampire':p.fame=clamp(p.fame+5);p.health=clamp(p.health+3);p.karma=clamp(p.karma-2);addLog('夜の血統を受け入れ、超常的な人生ルートを解放した。');break;case'blackmarket':state.blackMarketRep+=5;if(chance(75)){let gain=Math.round(5000*p.cost);p.bank+=gain;state.collectibles.push({name:'出所不明の希少品',type:'闇市場品',value:gain*1.4});addLog(`闇市場で希少品を入手。${money(gain)}相当の取引を行った。`)}else{p.karma=clamp(p.karma-8);p.prison+=2;addLog('闇市場の取引が摘発され、2年間の服役となった。')}break;case'fight':if(p.age<18){toast('大会参加は18歳から');return}p.fitness=clamp(p.fitness+7);if(chance(p.fitness*.65)){p.fame=clamp(p.fame+10);p.bank+=Math.round(10000*p.cost);addLog('格闘大会で勝利し、賞金と名声を手にした。')}else{p.health=clamp(p.health-10);addLog('格闘大会で敗北。トレーニングを続けよう。')}break;case'movie':if(p.age<18){toast('映画制作は18歳から');return}let rev=Math.round((5000+Math.random()*60000)*p.cost*(.4+p.smarts/120));p.bank+=rev;p.fame=clamp(p.fame+pick([4,8,12]));addLog(`映画を制作・公開し、${money(rev)}の収益を得た。`);break;case'music':p.fame=clamp(p.fame+pick([2,5,9]));p.bank+=Math.round(2000*p.cost);addLog('楽曲を制作・配信し、ファンが増えた。');break;case'politics':if(p.age<25){toast('政治活動は25歳から');return}if(chance(p.karma*.6+p.smarts*.3)){p.fame=clamp(p.fame+14);p.salary=Math.max(p.salary,65000*p.cost);addLog('選挙に当選し、公職に就いた。')}else{p.happiness-=3;addLog('選挙で敗北した。支持を広げて再挑戦しよう。')}break;case'cultGrow':if(!state.cult){toast('先に団体を設立してください');return}if(p.bank<1000){toast('団体運営に1,000以上必要です');return}p.bank-=1000;state.cult.members+=Math.round(2+Math.random()*8);state.cult.trust=clamp(state.cult.trust+pick([-5,2,5,8]));state.cult.wealth+=1000;addLog(`共同体の活動を広げ、メンバーが${state.cult.members}人になった。`);break;case'familytree':showModal('家系図',`${state.generation.map(g=>`<div class="item"><strong>${esc(g.name)}</strong><small>${g.age}歳 · ${esc(g.country)}</small></div>`).join('')||'<div class="empty">まだ世代の記録がありません。</div>'}<div class="item"><strong>現在：${esc(p.name)}</strong><small>${p.age}歳 · ${p.country}</small></div>`);return;case'timeline':showModal('人生年表',state.log.slice().reverse().map(l=>`<div class="logitem"><div class="year">${l.year}年 · ${l.age}歳</div><p>${esc(l.text)}</p></div>`).join(''));return;default:return;}save();render()}

function startLifeFromForm(form){
  if(!form) { toast('設定画面が見つかりません。タイトルからもう一度お試しください。'); return; }
  try {
    const get = name => form.elements.namedItem(name);
    const value = name => String(get(name)?.value ?? '').trim();
    const statsMode = value('stats');
    const stats = statsMode === 'balanced' ? {smarts:65,looks:60}
      : statsMode === 'genius' ? {smarts:95,looks:45}
      : statsMode === 'athlete' ? {smarts:50,looks:65} : {};
    const country = value('country') || '日本';
    const family = value('family') || 'middle';
    const data = {
      name: value('name') || 'あなた',
      sex: value('sex') || '未設定',
      country,
      familySurname: value('familySurname'),
      city: value('city'),
      family,
      god: creationGodMode,
      ...stats
    };
    newLife(data);
  } catch (error) {
    console.error('Life creation failed:', error);
    toast('誕生処理でエラーが発生しました。ページを再読み込みしてもう一度お試しください。');
  }
}

function LC_jobMin(j){return Number(j?.minAge??j?.age??18)}
function LC_jobEligibility(j,p=state?.player){
  if(!j||!p)return {ok:false,reason:'求人情報がありません'};
  if(p.age<LC_jobMin(j))return {ok:false,reason:`${LC_jobMin(j)}歳以上`};
  if(p.age<16)return {ok:false,reason:'16歳未満は就業できません'};
  if(p.prison>0)return {ok:false,reason:'服役中は応募できません'};
  if(p.smarts<Math.max(15,(j.req||0)-22))return {ok:false,reason:`知性 ${Math.max(15,(j.req||0)-22)}以上`};
  if((j.edu||0)>0&&(p.education||0)<j.edu)return {ok:false,reason:`教育レベル ${j.edu}以上`};
  if(j.minLooks&&p.looks<j.minLooks)return {ok:false,reason:`容姿 ${j.minLooks}以上`};
  if(j.minFitness&&p.fitness<j.minFitness)return {ok:false,reason:`体力 ${j.minFitness}以上`};
  if(j.minWorkYears&&(p.workYears||0)<j.minWorkYears)return {ok:false,reason:`実務経験 ${j.minWorkYears}年以上`};
  if(j.degreeAny?.length&&!j.degreeAny.includes(p.degree))return {ok:false,reason:`専攻：${j.degreeAny.join('・')}のいずれか`};
  return {ok:true,reason:'応募可能'};
}

function LC_trackForJob(j){
 if(j.track)return j.track;
 const n=j.name||'';
 if(/俳優|映画監督/.test(n))return 'performer';
 if(/歌手|音楽|DJ|作曲/.test(n))return 'music';
 if(/スポーツ|格闘|ゲーマー|レーサー/.test(n))return 'sports';
 if(/宇宙飛行士|科学者|研究/.test(n))return 'science';
 if(/開発|エンジニア|ソフトウェア/.test(n))return 'technology';
 if(/ジャーナリスト|記者|写真/.test(n))return 'media';
 if(/マフィア|ハスラー/.test(n))return 'criminal';
 if(/政治家|外交官/.test(n))return 'public';
 if(/警察|諜報|弁護士/.test(n))return 'law';
 if(/軍人|消防士/.test(n))return 'military';
 if(/パイロット/.test(n))return 'aviation';
 if(/医師|看護師|獣医|薬剤師|歯科|救急/.test(n))return 'medical';
 if(/シェフ|料理|パティシエ|バーテンダー/.test(n))return 'hospitality';
 if(/起業|CEO|経営|不動産|金融/.test(n))return 'business';
 if(/作家|デザイナー|マジシャン|モデル/.test(n))return 'creative';
 return 'service';
}
function LC_renderCareerTasks(p){
 if(!p.job)return '';
 const track=LC_trackForJob(p.job);const acts=LC_TRACK_ACTIONS[track]||LC_TRACK_ACTIONS.service;
 const points=(p.careerProgress||{})[p.job.name]||0;
 return `<div class="card" style="margin-top:14px"><div class="row between"><h3>🎯 ${esc(p.job.name)}：専門キャリア活動</h3><span class="tag greentag">進行度 ${Math.round(points)}%</span></div><p class="tiny">専門活動で実績を積むと、昇給・名声・大型案件につながります。活動には年齢・資金・健康状態などの条件があります。</p><div class="grid3">${acts.map((a,i)=>`<button class="small" data-career-task="${i}" ${p.age<LC_jobMin(p.job)||p.prison>0?'disabled':''}><b>${esc(a[1])}</b><small class="muted">${esc(a[2])}</small><small class="muted">費用 ${a[4]?money(Math.round(a[4]*p.cost)):'なし'}</small></button>`).join('')}</div></div>`;
}
function LC_runCareerTask(index){
 const p=state?.player;if(!p?.alive||!p.job)return;
 const track=LC_trackForJob(p.job);const actions=LC_TRACK_ACTIONS[track]||LC_TRACK_ACTIONS.service;const task=actions[index];
 if(!task)return;
 if(p.age<LC_jobMin(p.job)){toast(`${LC_jobMin(p.job)}歳以上からこのキャリア活動を行えます`);return;}
 if(p.prison>0){toast('服役中はキャリア活動を行えません');return;}
 const fee=Math.round((task[4]||0)*p.cost);if(p.bank<fee){toast(`活動費として${money(fee)}必要です`);return;}p.bank-=fee;
 p.careerProgress=p.careerProgress||{};const key=p.job.name;let progress=Number(p.careerProgress[key]||0);const skill=['sports','military','aviation'].includes(track)?'fitness':(['performer','model','music','creative','media'].includes(track)?'looks':'smarts');
 const stat=Number(p[skill]||50);let msg='';
 if(['practice','training','research'].includes(task[3])){p[skill]=clamp(stat+(task[3]==='research'?4:5));p.stress=clamp(p.stress+2);progress+=9;msg=`${task[1]}に取り組み、${skill==='fitness'?'体力':skill==='looks'?'表現力':'知性'}と専門性が伸びた。`;}
 else {
   const difficulty=task[3]==='mission'?22:task[3]==='election'?25:task[3]==='operation'?28:task[3]==='deal'?18:20;
   const odds=clamp(34+stat*.34+p.fame*.16+progress*.28+p.experience*.8-difficulty,8,92);
   if(chance(odds)){
     progress+=task[3]==='mission'?20:task[3]==='election'?18:15;
     const payout=Math.round((1200+Math.random()*6500+progress*28)*p.cost);
     p.bank+=payout;p.fame=clamp(p.fame+(p.job.fame?pick([2,4,6]):pick([0,1,2])));p.happiness=clamp(p.happiness+3);p.stress=clamp(p.stress+2);
     if(task[3]==='operation'){p.crimeRecord=(p.crimeRecord||0)+(chance(8+(state.crimeHeat||0)*.15)?1:0);state.crimeHeat=clamp((state.crimeHeat||0)+6);}
     if(task[3]==='mission'&&chance(5)){p.health=clamp(p.health-5);msg='任務は成功したが、軽い負傷を負った。';}
     if(!msg)msg=`${task[1]}が成功し、報酬${money(payout)}とキャリア実績を得た。`;
     if(progress>=100){p.rank=(p.rank||0)+1;p.salary=Math.round((p.salary||30000)*1.1);progress-=65;msg+=' 専門キャリアの段階が上がり、年収も増えた。';}
   }else{progress+=4;p.stress=clamp(p.stress+5);p.happiness=clamp(p.happiness-2);if(['sports','military','aviation'].includes(track)&&chance(12)){p.health=clamp(p.health-6);msg=`${task[1]}はうまくいかず、軽いケガをした。`; }else msg=`${task[1]}は成果につながらなかったが、経験を得た。`;}
 }
 p.careerProgress[key]=clamp(progress,0,100);addLog(msg);save();render();
}

// Age-based access is enforced in the UI and again in the action handlers.
function LC_applyAgeLocks(root=document){
 const p=state?.player;if(!p)return;
 root.querySelectorAll?.('[data-action]').forEach(b=>{
   const rule=LC_ACTION_RULES[b.dataset.action];if(!rule)return;
   const blocked=p.age<rule.age;
   if(blocked){b.disabled=true;b.title=`${rule.age}歳以上から利用できます`;b.setAttribute('aria-disabled','true');if(!b.querySelector('.lc-age-note')){const note=document.createElement('small');note.className='muted lc-age-note';note.textContent=`🔒 ${rule.age}歳以上`;b.appendChild(note);}}
   else{b.removeAttribute('aria-disabled');b.querySelector('.lc-age-note')?.remove();if(b.title===`${rule.age}歳以上から利用できます`)b.removeAttribute('title');}
 });
 root.querySelectorAll?.('[data-modal-action]').forEach(b=>{
   const a=b.dataset.modalAction;let rule=LC_ACTION_RULES[a];
   if(a==='emigrate')rule=LC_ACTION_RULES.emigrateModal;
   if(a==='relkind')rule=LC_ACTION_RULES.rel;
   if(!rule)return;
   if(p.age<rule.age){b.disabled=true;b.title=`${rule.age}歳以上から利用できます`;if(!b.querySelector('.lc-age-note')){const note=document.createElement('small');note.className='muted lc-age-note';note.textContent=`🔒 ${rule.age}歳以上`;b.appendChild(note);}}
 });
}

jobList=function(){const p=state.player;const rows=jobs.map((j,i)=>({j,i,elig:LC_jobEligibility(j,p)})).sort((a,b)=>Number(b.elig.ok)-Number(a.elig.ok)||LC_jobMin(a.j)-LC_jobMin(b.j));const html=rows.map(({j,i,elig})=>`<div class="item"><div><strong>${esc(j.name)}</strong><small>${esc(j.sector)} · 基本年収 ${money(j.salary||30000)} · 最低年齢 ${LC_jobMin(j)}歳 · 教育Lv.${j.edu||0}${j.minWorkYears?` · 実務経験${j.minWorkYears}年`:''}</small><small>${elig.ok?'応募条件を満たしています':`🔒 ${esc(elig.reason)}`}</small></div><button class="small ${elig.ok?'primary':''}" data-modal-action="apply" data-index="${i}" ${elig.ok?'':'disabled'}>${elig.ok?'応募':'条件未達'}</button></div>`).join('');showModal('求人一覧・キャリア検索',`<p class="tiny">${p.age}歳の応募可能な職種を表示しています。年齢だけでなく、知性・学歴・専攻・体力・容姿・実務経験も審査されます。職種は${jobs.length}種類あります。</p>${html}`);};

actionDispatch=function(a,el){if(state?.player&&!LC_ageAllowed(a,state.player.age,true)){LC_ageAllowed(a,state.player.age,false);return;}if(a==='degree'&&state?.player?.education!==2){toast('専攻は大学在学中に選択できます');return;}if(a==='graduate'&&(state?.player?.education!==2||(state.player.universityYears||0)<4||state.player.age<22)){toast('大学卒業には22歳以上・4年間の在学が必要です');return;}if(a==='quit'&&state?.player?.job)LC_recordCareer(state.player,'退職');return LC_baseActionDispatch.apply(this,arguments);};
const LC_baseAct=act;
act=function(type){const p=state?.player;if(p&&!LC_ageAllowed(type,p.age,true)){LC_ageAllowed(type,p.age,false);return;}if(type==='work'&&p){if(p.age<18){ // 16–17歳は学業と両立する短時間アルバイト
  if(p.age<16){toast('仕事・アルバイトは16歳以上からです');return;}
  if(p.prison>0){toast('服役中は働けません');return;}
  const gain=Math.round((p.job?Math.min(p.salary*.015,900):420)*p.cost);p.bank+=gain;p.stress=clamp(p.stress+2);addLog(`学業と両立できる短時間アルバイトを行い、${money(gain)}を得た。`);save();render();return;
 }}return LC_baseAct.apply(this,arguments);};
const LC_baseChoiceAction=choiceAction;
choiceAction=function(id){const p=state?.player;if(p&&!LC_ageAllowed(id,p.age,true)){LC_ageAllowed(id,p.age,false);return;}return LC_baseChoiceAction.apply(this,arguments);};

// Career progression and high-school/university milestones in the annual tick.
const LC_baseAgeUp=ageUp;
ageUp=function(){const p=state?.player;if(!p)return;
 if(p.job&&p.age+1<LC_jobMin(p.job)){LC_recordCareer(p,'年齢編集・就業資格の再確認');addLog(`${p.job.name}は最低就業年齢に達していないため、職を離れた。`);p.job=null;p.salary=0;p.jobYears=0;p.retired=false;}
 const wasUniversity=p.education===2;const beforeAge=p.age;LC_baseAgeUp.apply(this,arguments);
 if(state?.player&&state.player.age===beforeAge+1){const q=state.player;if(wasUniversity&&q.education===2){q.universityYears=(q.universityYears||0)+1;if(q.universityYears===4)addLog('大学で4年間学び、卒業資格を得た。教育メニューから卒業できます。');save();render();}}
};
// Wrap university admission/graduation so progress and age are actually checked.
const LC_baseUniversity=university;
university=function(){const p=state?.player;if(!p||!LC_ageAllowed('university',p.age,false))return;const old=p.education;LC_baseUniversity.apply(this,arguments);if(p.education===2&&old!==2){p.universityStartAge=p.age;p.universityYears=0;save();render();}};
const LC_baseGraduate=graduate;
graduate=function(){const p=state?.player;if(!p)return;if(p.age<22||p.education!==2||(p.universityYears||0)<4){toast('大学卒業には22歳以上・4年間の在学が必要です');return;}LC_baseGraduate.apply(this,arguments);};

// Apply age/condition checks to direct modal handlers too. Capture phase prevents bypasses.
document.addEventListener('click',function(e){
 const career=e.target.closest?.('[data-career-task]');if(career){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();LC_runCareerTask(Number(career.dataset.careerTask));return;}
 const b=e.target.closest?.('[data-modal-action]');if(!b)return;const a=b.dataset.modalAction;const p=state?.player;if(!p)return;
 let rule=LC_ACTION_RULES[a];if(a==='emigrate')rule=LC_ACTION_RULES.emigrateModal;if(a==='relkind')rule=LC_ACTION_RULES.rel;
 if(rule&&!LC_ageAllowed(a==='emigrate'?'emigrateModal':a==='relkind'?'rel':a,p.age,true)){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();LC_ageAllowed(a==='emigrate'?'emigrateModal':a==='relkind'?'rel':a,p.age,false);return;}
 if(a==='apply'){const job=jobs[Number(b.dataset.index)];const elig=LC_jobEligibility(job,p);if(!elig.ok){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();toast(`応募できません：${elig.reason}`);return;}}
 if(a==='datingLike'&&p.age<18){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();toast('マッチングアプリは18歳以上から利用できます');return;}
},true);

function LC_ceOption(label, result, fx={}) { return {label, result, fx}; }
function LC_ceEvent(id, category, condition, title, text, options, meta={}) {
  // Some compact templates omit a separate internal ID. Normalize both
  // signatures, including the variant that passes metadata as the sixth arg.
  if(!Array.isArray(options)){
    const extra=(options&&typeof options==='object'&&!Array.isArray(options))?options:{};
    options=text; text=title; title=condition; condition=category; category=id;
    id='context_event'; meta=extra;
  }
  return {contextual:true, contextId:id, contextCategory:category,
    contextCondition:condition, title, text, options, ...meta};
}
function LC_ceRecent(id) {
  const h=state?.contextEventHistory||[];

}

function LC_applyContextEffects(option, event) {
  const p=state.player, fx=option.fx||{};
  const statKeys=['health','happiness','smarts','looks','fitness','stress','karma','fame'];
  statKeys.forEach(k=>{if(Number.isFinite(Number(fx[k])))p[k]=clamp(Number(p[k]||0)+Number(fx[k]));});
  if(Number(fx.bank)){
    const delta=Math.round(Number(fx.bank)*Number(p.cost||1));
    if(delta>=0)p.bank=Math.max(0,Number(p.bank||0)+delta);
    else {const cost=-delta, paid=Math.min(Number(p.bank||0),cost);p.bank-=paid;if(cost>paid)p.debt=(Number(p.debt)||0)+(cost-paid);}
  }
  if(Number(fx.debt))p.debt=Math.max(0,(Number(p.debt)||0)+Math.round(Number(fx.debt)*Number(p.cost||1)));
  if(Number(fx.experience))p.experience=Math.max(0,(p.experience||0)+Number(fx.experience));
  if(Number(fx.career)&&p.job){p.careerProgress=p.careerProgress||{};p.careerProgress[p.job.name]=clamp((p.careerProgress[p.job.name]||0)+Number(fx.career));}
  if(Number(fx.salaryPct)&&p.job)p.salary=Math.max(0,Math.round(p.salary*(1+Number(fx.salaryPct)/100)));
  if(Number(fx.crimeHeat))state.crimeHeat=clamp((state.crimeHeat||0)+Number(fx.crimeHeat));
  if(Number(fx.prison))p.prison=Math.max(0,(p.prison||0)+Number(fx.prison));
  if(Number(fx.partner)&&p.partner)p.partner.closeness=clamp((p.partner.closeness||50)+Number(fx.partner));
  if(Number(fx.friend)&&p.friends?.length){const r=p.friends.reduce((a,b)=>(Number(b.closeness||50)>Number(a.closeness||50)?b:a),p.friends[0]);r.closeness=clamp((r.closeness||50)+Number(fx.friend));}
  if(Number(fx.family)&&p.family?.length){const r=p.family.find(x=>x.alive!==false)||p.family[0];if(r)r.closeness=clamp((r.closeness||50)+Number(fx.family));}
  if(Number(fx.child)&&p.children?.length){const idx=Number(event.targetChild??0),r=p.children[idx]||p.children[0];if(r)r.closeness=clamp((r.closeness||50)+Number(fx.child));}
  if(Number(fx.allChildren)&&p.children?.length)p.children.forEach(r=>r.closeness=clamp((r.closeness||50)+Number(fx.allChildren)));
  if(fx.newFriend){p.friends=p.friends||[];p.friends.push({name:pick(['葵','蓮','美月','ソフィア','リアム','エマ','湊','莉子']),relation:'友人・紹介',age:p.age,closeness:58});}
  if(fx.sellOneProperty&&state.properties?.length){const x=state.properties.shift();const proceeds=Math.round((x.value||0)*.94);p.bank=(p.bank||0)+proceeds;}
  if(Number(fx.propertyValuePct)&&state.properties?.length)state.properties.forEach(x=>x.value=Math.max(0,Math.round(x.value*(1+Number(fx.propertyValuePct)/100))));
  if(Number(fx.businessMargin)&&p.business)p.business.margin=Math.min(.48,(p.business.margin||.25)+Number(fx.businessMargin));
  if(Number(fx.businessValuePct)&&p.business)p.business.value=Math.round(p.business.value*(1+Number(fx.businessValuePct)/100));
  if(fx.retire&&p.job){LC_recordCareer(p,'引退');p.retired=true;p.pension=Math.round((p.salary||0)*.32);p.job=null;p.salary=0;}
  if(event.contextId==='school_future_path'&&option.label==='進学を目指して勉強する')p.education=Math.max(1,p.education||0);
  statKeys.forEach(k=>p[k]=clamp(p[k]));
  const msg=option.result||'状況に応じた選択をした。';
  state.contextEventHistory=state.contextEventHistory||[];
  state.contextEventHistory.unshift({id:event.contextId,title:event.title,category:event.contextCategory,year:state.year,age:p.age,choice:option.label});
  state.contextEventHistory=state.contextEventHistory.slice(0,80);
  state.contextEventCount=(state.contextEventCount||0)+1;
  state.pending=null;
  addLog(`${event.title}［${event.contextCategory}］：${msg}`);
  checkAchievements();save();render();
}

makeEvent=function(){
  const p=state?.player;
  if(!p||!p.alive)return LC_contextBaseMakeEvent.apply(this,arguments);
  state.contextEventHistory=state.contextEventHistory||[];
  const candidates=LC_ceCandidates(p);
  if(candidates.length&&Math.random()<.68){
    const total=candidates.reduce((n,x)=>n+x.weight,0);let n=Math.random()*total;
    for(const c of candidates){n-=c.weight;if(n<=0){const ev=c.build();if(ev){ev.contextual=true;ev.contextId=c.id;return ev;}break;}}
  }
  return LC_contextBaseMakeEvent.apply(this,arguments);
};

resolveChoice=function(index){
  const ev=state?.pending;
  if(ev?.contextual){const option=ev.options?.[index];if(!option)return;LC_applyContextEffects(option,ev);return;}
  return LC_contextBaseResolveChoice.apply(this,arguments);
};

renderPending=function(){
  const e=state?.pending;if(!e)return '';
  if(!e.contextual)return LC_contextBaseRenderPending.apply(this,arguments);
  return `<div class="eventbox context-event"><div class="row between"><div class="tiny gold">CONTEXT EVENT · ${esc(e.contextCategory||'状況依存イベント')}</div><span class="tag greentag">条件分岐型</span></div><div class="tiny" style="margin:5px 0 8px;color:#b9c9df">発生条件：${esc(e.contextCondition||'現在のキャラクターの状況')}</div><h3>${esc(e.title)}</h3><div>${esc(e.text)}</div><div class="choices">${e.options.map((o,i)=>`<button data-action="choice" data-index="${i}">${esc(o.label)} <span class="tiny">→</span></button>`).join('')}</div></div>`;
};

const LC_MASS_GATE = {
 always:()=>true,
 tenure1:p=>(Number(p.jobYears)||0)>=1,
 tenure3:p=>(Number(p.jobYears)||0)>=3,
 progress:p=>Number((p.careerProgress||{})[p.job?.name]||0)>=8,
 stress:p=>Number(p.stress||0)>=32,
 health:p=>Number(p.health||100)<=82,
 ethics:p=>Number(p.karma||50)<=62,
 social:p=>(p.friends||[]).length>0||!!p.partner||(p.children||[]).length>0,
 smart:p=>Number(p.smarts||0)>=52,
 fitness:p=>Number(p.fitness||0)>=52,
 fame:p=>Number(p.fame||0)>=8,
 wealth:p=>netWorth()>=10000,
 lowcash:p=>Number(p.bank||0)<Math.max(18000,Number(p.salary||0)*.35),
 lead:p=>Number(p.rank||0)>=1||(Number(p.jobYears)||0)>=5,
 veteran:p=>Number(p.age||0)>=55||(Number(p.jobYears)||0)>=15
};
const LC_MASS_CAREER_CATALOG=[];
const LC_MASS_CAREER_BY_JOB=new Map();
for(let ji=0;ji<jobs.length;ji++){
 const j=jobs[ji], min=LC_jobMin(j);
 for(let pi=0;pi<LC_MASS_PHASES.length;pi++){
  const ph=LC_MASS_PHASES[pi], ageMin=min+ph.offset, ageMax=ph.span>=84?112:Math.min(112,min+ph.offset+ph.span);
  for(let si=0;si<LC_MASS_SCENARIOS.length;si++){
   const sc=LC_MASS_SCENARIOS[si];
   const entry={id:`masscareer_${ji}_${pi}_${si}`,jobName:j.name,sector:j.sector||'専門職',phase:ph,scenario:sc,ageMin,ageMax,jobIndex:ji,scenarioIndex:si};
   LC_MASS_CAREER_CATALOG.push(entry);
   if(!LC_MASS_CAREER_BY_JOB.has(j.name))LC_MASS_CAREER_BY_JOB.set(j.name,[]);
   LC_MASS_CAREER_BY_JOB.get(j.name).push(entry);
  }
 }
}

const LC_massBaseCandidates=LC_ceCandidates;
LC_ceCandidates=function(p){
 const out=LC_massBaseCandidates.apply(this,arguments);
 if(!p)return out;
 const age=Number(p.age)||0;
 const addMass=(id,weight,build)=>{if(!LC_ceRecent(id)&&!out.some(x=>x.id===id))out.push({id,weight,build});};
 if(p.job&&p.prison===0&&!p.retired){
  const list=LC_MASS_CAREER_BY_JOB.get(p.job.name)||[];
  for(const e of list){
   if(age<e.ageMin||age>e.ageMax)continue;
   if(!LC_MASS_GATE[e.scenario.gate](p))continue;
   const j=p.job,ph=e.phase,sc=e.scenario;
   addMass(e.id,1.25,()=>LC_ceEvent(e.id,`職業・${e.scenario.cat}`,`${j.name}として${e.ageMin}～${e.ageMax}歳、${ph.label}にあり、${sc.gate==='always'?'在職中':`条件「${sc.gate}」を満たしている`}`,`${j.name}：${sc.title[LC_MASS_PHASES.indexOf(ph)]}`,sc.body(j,ph),sc.opts.map(o=>LC_ceOption(o[0],o[1],{...o[2],career:o[2].career?Math.round(o[2].career*(1+LC_MASS_PHASES.indexOf(ph)*.12)):o[2].career}))));
  }
 }
 for(const e of LC_MASS_LIFE_CATALOG){
  if(age<e.band.min||age>e.band.max||!e.spec.gate(p,state))continue;
  const sp=e.spec,band=e.band;
  addMass(e.id,1.1,()=>LC_ceEvent(e.id,sp.cat,`${band.min}～${band.max}歳で、${LC_MASS_LIFE_CONDITION_TEXT[sp.id]||'現在の生活条件を満たしている'}`,`${band.label}：${sp.title}`,`${band.tag}。${sp.body}`,sp.opts.map(o=>LC_ceOption(o[0],o[1],{...o[2]}))));
 }
 return out;
};

function LC_romanToKana(input){
 let str=String(input??'').trim();if(!str)return str;
 if(/[\u3040-\u30ff\u3400-\u9fff]/.test(str)&&!/[A-Za-zÀ-ž]/.test(str)){
   if(LC_kanaExact[str])return LC_kanaExact[str];
   return Array.from(str).map(ch=>{const code=ch.charCodeAt(0);if(code>=0x3041&&code<=0x3096)return String.fromCharCode(code+0x60);return LC_kanaExact[ch]||ch;}).join('');
 }
 const words=str.split(/([\s'-]+)/);return words.map(w=>{if(/^[\s'-]+$/.test(w))return '・';if(LC_kanaExact[w])return LC_kanaExact[w];
  let x=w.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ß/g,'ss').toLowerCase();
  const digraph={'tch':'ッチ','sch':'シュ','sh':'シ','ch':'チ','th':'ス','ph':'フ','ck':'ック','qu':'ク','ng':'ング','ee':'イー','oo':'ウー','ou':'アウ','ow':'アウ','ai':'アイ','ay':'エイ','oi':'オイ','oy':'オイ','au':'オー','ea':'イー','ie':'アイ','ei':'エイ','igh':'アイ','tion':'ション','sion':'ジョン','ia':'イア','io':'イオ','ya':'ヤ','yo':'ヨ','yu':'ユ'};
  let out='',i=0;const cv={'a':'ア','i':'イ','u':'ウ','e':'エ','o':'オ','b':'ブ','c':'ク','d':'ド','f':'フ','g':'グ','h':'ハ','j':'ジ','k':'ク','l':'ル','m':'ム','n':'ン','p':'プ','q':'ク','r':'ル','s':'ス','t':'ト','v':'ヴ','w':'ウ','x':'クス','y':'イ','z':'ズ'};
  while(i<x.length){let hit=false;for(const n of [4,3,2]){const a=x.slice(i,i+n);if(digraph[a]){out+=digraph[a];i+=n;hit=true;break;}}if(hit)continue;
   const c=x[i],next=x[i+1];if(c===next&&/[bcdfghjklmnpqrstvwxyz]/.test(c)){out+='ッ';i++;continue;}
   if(/[aeiou]/.test(c)){out+=cv[c];i++;continue;}
   if(/[bcdfghjklmnpqrstvwxyz]/.test(c)){out+=cv[c]||'';i++;continue;}i++;
  }
  return out.replace(/([イウ])ー/g,'$1ー').replace(/ッ([ア-オ])/g,'ッ$1').replace(/ル([ア-オ])/g,'ル$1');
 }).join('');
}

// Beat Life tuning: annual events are not guaranteed; AAA credits-page secret.
// These wrappers are deliberately installed after all existing event/name wrappers
// so they affect every event family without rewriting any of their content.
// ─────────────────────────────────────────────────────────────────────────────
const LC_eventFrequencyBaseMakeEvent = makeEvent;
makeEvent = function(){
  const p = state?.player;
  if(!p || !p.alive) return LC_eventFrequencyBaseMakeEvent.apply(this, arguments);
  // A quiet year is normal: approximately 70% of years produce one event.
  if(Math.random() >= 0.70) return null;
  return LC_eventFrequencyBaseMakeEvent.apply(this, arguments);
};

const LC_AAA_SECRET_PENDING_KEY = 'beatLifeAAASecretPending_v1';
let LC_AAA_sequence = 0;
let LC_AAA_lastKeyAt = 0;
document.addEventListener('keydown', function(ev){
  const creditsHeading = document.querySelector('#modal h2');
  const isCreditsOpen = !!creditsHeading && creditsHeading.textContent.trim() === 'クレジット';
  if(!isCreditsOpen){ LC_AAA_sequence = 0; LC_AAA_lastKeyAt = 0; return; }
  if(ev.repeat) return;
  const isA = ev.key === 'a' || ev.key === 'A' || ev.code === 'KeyA';
  if(!isA){ LC_AAA_sequence = 0; LC_AAA_lastKeyAt = 0; return; }
  const now = Date.now();
  if(now - LC_AAA_lastKeyAt > 2500) LC_AAA_sequence = 0;
  LC_AAA_lastKeyAt = now;
  LC_AAA_sequence++;
  if(LC_AAA_sequence >= 3){
    LC_AAA_sequence = 0;
    LC_AAA_lastKeyAt = 0;
    try {
      localStorage.setItem(LC_AAA_SECRET_PENDING_KEY, '1');
      toast('隠し要素を解放！次に始める新しい人生に特典が適用されます。');
    } catch(error) {
      toast('隠し要素を保存できませんでした。ブラウザの保存領域を確認してください。');
    }
  }
});

const LC_secretBaseNewLife = newLife;
newLife = function(data){
  const result = LC_secretBaseNewLife.apply(this, arguments);
  let secretPending = false;
  try { secretPending = localStorage.getItem(LC_AAA_SECRET_PENDING_KEY) === '1'; }
  catch(error) { secretPending = false; }
  if(secretPending && state?.player){
    const p = state.player;
    // All positive character attributes are maxed. Stress is a negative meter,
    // so it starts at zero (best possible) rather than at a harmful 100%.
    p.health = 100;
    p.happiness = 100;
    p.smarts = 100;
    p.looks = 100;
    p.fitness = 100;
    p.karma = 100;
    p.fame = 100;
    p.stress = 0;
    p.bank = 1000000000000;
    p.parentsMoney = 1000000000000;
    p.savings = 0;
    p.debt = 0;
    addLog('クレジット画面の隠し要素が発動し、全能力が最大になり、初期資産1兆を得た。');
    try { localStorage.removeItem(LC_AAA_SECRET_PENDING_KEY); }
    catch(error) { /* The saved game still records the applied bonus. */ }
    save();
    render();
    toast('AAA特典を適用しました！能力最大・初期資産1兆。');
  }
  return result;
};
