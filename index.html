const LC_LIFE_HISTORY_KEY = 'beatLifeLifeHistory_v1';
function LC_hasSavedGame(){
  try{const raw=localStorage.getItem('chronicleLifeSave');if(!raw)return false;const s=JSON.parse(raw);return !!(s&&s.player&&s.player.alive);}catch(e){return false;}
}
function LC_readHistory(){try{const a=JSON.parse(localStorage.getItem(LC_LIFE_HISTORY_KEY)||'[]');return Array.isArray(a)?a:[];}catch(e){return [];}}
function LC_writeHistory(a){try{localStorage.setItem(LC_LIFE_HISTORY_KEY,JSON.stringify(a.slice(0,250)));return true;}catch(e){toast('人生記録を保存できませんでした');return false;}}
function LC_makeLifeRecord(source,status='人生終了'){
  if(!source?.player)return null;
  const p=source.player;
  let worth=0;
  try{if(source===state&&p===state.player)worth=netWorth();else worth=(p.bank||0)+(p.savings||0)-(p.debt||0)+(source.properties||[]).reduce((n,x)=>n+(Number(x.value)||0),0)+(source.vehicles||[]).reduce((n,x)=>n+(Number(x.value)||0),0)+(source.collectibles||[]).reduce((n,x)=>n+(Number(x.value)||0),0)+(source.portfolio||[]).reduce((n,x)=>n+(Number(x.units)||0)*(Number(x.price)||0),0)+(p.business?.value||0);}catch(e){worth=Number(p.netWorth)||Number(p.bank)||0;}
  const id=source.lifeRecordId||('life_'+(source.startedAt||'')+'_'+String(p.name||'').slice(0,18)+'_'+(source.year||0));
  return {id,mode:source.unlocks?.god===true?'god':'normal',name:p.name||'不明',accountName:LC_currentAccountLabelForRanking(),country:p.country||'不明',city:p.city||'',currencyCode:p.currency||'XXX',currencySymbol:p.currencySymbol||'¤',age:Number(p.age)||0,year:Number(source.year)||0,status,netWorth:Math.round(worth),health:Math.round(p.health||0),happiness:Math.round(p.happiness||0),smarts:Math.round(p.smarts||0),looks:Math.round(p.looks||0),fitness:Math.round(p.fitness||0),fame:Math.round(p.fame||0),karma:Math.round(p.karma||0),stress:Math.round(p.stress||0),children:(p.children||[]).length,job:p.job?.name||p.careerHistory?.[0]?.name||'職業なし',events:Number(source.stats?.events)||0,log:(source.log||[]).slice(-18).map(x=>({age:x.age,year:x.year,text:x.text})),ribbons:(source.ribbons||[]).slice(0,12),savedAt:new Date().toISOString()};
}
function LC_archiveLife(source,status='人生終了'){
  const rec=LC_makeLifeRecord(source,status);if(!rec)return;
  const all=LC_readHistory();const idx=all.findIndex(x=>x.id===rec.id);
  if(idx>=0)all[idx]=rec;else all.unshift(rec);
  LC_writeHistory(all);
}
function LC_allLifeRecords(){
  const all=LC_readHistory();
  try{const raw=localStorage.getItem('chronicleLifeSave');if(raw){const s=JSON.parse(raw);if(s?.player){const id=s.lifeRecordId||('legacy_'+s.player.name+'_'+s.year);if(!all.some(x=>x.id===id)){const r=LC_makeLifeRecord(s,s.player.alive?'プレイ中':'人生終了');if(r){r.id=id;all.unshift(r);if(!s.player.alive)s.lifeRecordId=id;}}}}}catch(e){}
  if(state?.player){const r=LC_makeLifeRecord(state,state.player.alive?'プレイ中':'人生終了');if(r){const i=all.findIndex(x=>x.id===r.id);if(i<0)all.unshift(r);else if(state.player.alive)all[i]=r;}}
  return all.sort((a,b)=>String(b.savedAt||'').localeCompare(String(a.savedAt||''))).slice(0,250);
}

// Give every new life a stable record id and archive a previous unfinished save
// before it is replaced by a new character.
const LC_historyBaseNewLife=newLife;
newLife=function(data){
  try{const old=JSON.parse(localStorage.getItem('chronicleLifeSave')||'null');if(old?.player?.alive&&old.lifeRecordId!==state?.lifeRecordId)LC_archiveLife(old,'中断');}catch(e){}
  const result=LC_historyBaseNewLife.apply(this,arguments);
  if(state?.player){state.lifeRecordId='life_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,9);state.startedAt=new Date().toISOString();save();}
  return result;
};
const LC_historyBaseDie=die;
die=function(){const wasAlive=!!state?.player?.alive;const result=LC_historyBaseDie.apply(this,arguments);if(wasAlive&&state?.player){LC_archiveLife(state,'人生終了');}return result;};
const LC_historyBaseHeir=continueAsHeir;
continueAsHeir=function(){const previous=state?.player?.alive?LC_makeLifeRecord(state,'人生終了'):null;const result=LC_historyBaseHeir.apply(this,arguments);if(previous){previous.status='世代継承';const all=LC_readHistory();if(!all.some(x=>x.id===previous.id))all.unshift(previous);LC_writeHistory(all);}if(state?.player){state.lifeRecordId='life_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,9);state.startedAt=new Date().toISOString();save();}return result;};

const LC_SUPABASE_URL='https://ktuzagrnwhoocfptiuvb.supabase.co';
// Supabase publishable key: intended for browser clients; never place a service-role/secret key here.
const LC_SUPABASE_PUBLISHABLE_KEY='sb_publishable_QLYjxUDENfBd-7XAO3LH9A_k6LsHlSh';

const LC_ONLINE_OPTIN_KEY='beatLifeOnlineUploadEnabled_v1';
const LC_ONLINE_CATEGORIES=[
  ['net_worth','純資産','通貨額'],['age','最高年齢','歳'],['health','健康','点'],['happiness','幸福','点'],['smarts','知性','点'],['looks','容姿','点'],['fitness','体力','点'],['fame','名声','点'],['karma','カルマ','点'],['children','子ども','人']

function LC_onlineHeaders(extra={}){return {'apikey':LC_SUPABASE_PUBLISHABLE_KEY,...extra};}
function LC_onlineValue(row,key){
  const n=Number(row[key])||0;
  if(key==='net_worth')return `${row.currency_symbol||''}${Math.round(n).toLocaleString('en-US')}`;
  const suffix=key==='age'?'歳':key==='children'?'人':'点';
  return `${Math.round(n)}${suffix}`;
}
function LC_onlineErrorText(status,body){
  let detail=String(body||'');try{const j=JSON.parse(detail);detail=j.message||j.error_description||j.hint||detail;}catch(e){}
  if(status===404||/relation .* does not exist|Could not find the table/i.test(detail))return 'ランキング用テーブルがまだありません。SupabaseのSQL Editorで付属の Beat_Life_Supabase_Setup.sql を実行してね。';
  if(status===401||status===403)return 'Supabaseの接続キーまたはテーブル権限を確認してね。SQLのRLS・GRANT設定が必要です。';
  return `通信エラー（HTTP ${status}）：${String(detail).slice(0,240)}`;
}
async function LC_fetchOnlineRanking(key='net_worth'){
  const allowed=LC_ONLINE_CATEGORIES.some(x=>x[0]===key);if(!allowed)key='net_worth';
  const url=`${LC_SUPABASE_URL}/rest/v1/${LC_SUPABASE_TABLE}?select=life_id,account_id,username,character_name,country,currency_code,currency_symbol,age,net_worth,health,happiness,smarts,looks,fitness,fame,karma,children,status,mode,assist_used,created_at&mode=eq.normal&assist_used=eq.false&order=${encodeURIComponent(key)}.desc.nullslast&limit=10`;
  const response=await fetch(url,{method:'GET',headers:LC_onlineHeaders({'Accept':'application/json'})});
  if(!response.ok)throw new Error(LC_onlineErrorText(response.status,await response.text()));
  return await response.json();
}
function LC_onlineRowsHtml(rows,key){
  if(!rows.length)return '<div class="empty">まだオンライン記録がありません。人生を終了したあと「人生をオンライン送信」を押してね。</div>';
  return rows.slice(0,10).map((r,i)=>`<div class="item bl-ranking-row"><div style="min-width:0"><b><span class="tag ${i===0?'goldtag':''}">${i+1}位</span> ${esc(r.character_name||'名無し')}（${esc(r.username||'Player')}）</b><small>${esc(r.country||'不明')} · ${Number(r.age)||0}歳 · ${esc(r.status||'')}</small></div><b class="gold" style="white-space:nowrap">${esc(LC_onlineValue(r,key))}</b></div>`).join('');
}
async function LC_showOnlineRankings(key='net_worth'){
  if(!LC_ONLINE_CATEGORIES.some(x=>x[0]===key))key='net_worth';
  const opts=LC_ONLINE_CATEGORIES.map(([k,l])=>`<option value="${k}" ${k===key?'selected':''}>${l}部門</option>`).join('');
  showModal('世界ランキング',`<div class="row" style="gap:8px;align-items:center;flex-wrap:wrap"><select id="LC_onlineCategory" style="flex:1;min-width:150px">${opts}</select><button data-online-action="refresh">更新</button><button data-online-action="upload">人生を送信</button></div><div class="notice" style="margin-top:10px">全プレイヤーが送信した人生の上位50件。人生の名前・国・成績は公開されます。純資産はゲーム内の各国通貨額をそのまま比較するため、為替換算ではありません。</div><div id="LC_onlineRows" class="metric" style="margin-top:10px">ランキングを読み込み中...</div><div class="row" style="justify-content:space-between;margin-top:12px"><button data-online-action="back">← 端末内ランキング</button><small class="tiny">Beat Life Global Rankings</small></div>`);
  try{
    const rows=await LC_fetchOnlineRanking(key);
    const target=document.getElementById('LC_onlineRows');
    if(target)target.innerHTML=LC_onlineRowsHtml(rows,key);
  }catch(error){
    const target=document.getElementById('LC_onlineRows');
    if(target)target.innerHTML=`<div class="empty">${esc(error.message||'ランキングを読み込めませんでした')}</div>`;
  }
}
function LC_toOnlineRow(r){
  const status=['人生終了','中断','世代継承'].includes(r.status)?r.status:'人生終了';
  const num=(v,min,max)=>Math.max(min,Math.min(max,Math.round(Number(v)||0)));
  const lifeId=String(r.id||('life_'+Date.now()+'_'+Math.random().toString(36).slice(2))).slice(0,120);
  const countryInfo=(countries||[]).find(c=>c[0]===r.country)||(countries||[])[0]||['不明','', 'XXX','¤'];
  return {life_id:lifeId,mode:r.mode==='god'?'god':'normal',character_name:String(r.name||'名無し').trim().slice(0,40)||'名無し',country:String(r.country||'不明').slice(0,40),currency_code:String(r.currencyCode||countryInfo[2]||'XXX').slice(0,8),currency_symbol:String(r.currencySymbol||countryInfo[3]||'¤').slice(0,8),age:num(r.age,0,120),net_worth:String(Math.trunc(Math.max(-1e29,Math.min(1e29,Number(r.netWorth)||0)))),health:num(r.health,0,100),happiness:num(r.happiness,0,100),smarts:num(r.smarts,0,100),looks:num(r.looks,0,100),fitness:num(r.fitness,0,100),fame:num(r.fame,0,100),karma:num(r.karma,0,100),children:num(r.children,0,10000),status};
}
async function LC_postOnlineRecords(records,showFeedback=true){
  const payload=records.filter(r=>r&&r.status!=='プレイ中'&&r.mode!=='god').map(LC_toOnlineRow);
  if(!payload.length){if(showFeedback)toast('送信できる終了済みの人生がありません。人生を終えると送信できます。');return 0;}
  const url=`${LC_SUPABASE_URL}/rest/v1/${LC_SUPABASE_TABLE}?on_conflict=life_id`;
  const response=await fetch(url,{method:'POST',headers:LC_onlineHeaders({'Content-Type':'application/json','Prefer':'resolution=ignore-duplicates,return=minimal'}),body:JSON.stringify(payload)});
  if(!response.ok)throw new Error(LC_onlineErrorText(response.status,await response.text()));
  try{localStorage.setItem(LC_ONLINE_OPTIN_KEY,'1');}catch(e){}
  if(showFeedback)toast(`送信処理が完了しました：${payload.length}人生（既送信分は重複登録されません）`);
  return payload.length;
}
async function LC_uploadLifeHistory(){
  try{
    const completed=LC_allLifeRecords().filter(r=>r.status!=='プレイ中'&&r.mode!=='god');
    if(!completed.length){toast('送信できる終了済みの人生がまだありません');return;}
    toast('オンラインランキングへ送信中...');
    await LC_postOnlineRecords(completed,true);
    const key=document.getElementById('LC_onlineCategory')?.value||LC_currentOnlineRankKey||'net_worth';
    if(document.getElementById('LC_onlineRows'))await LC_showOnlineRankings(key);
  }catch(error){toast(error.message||'オンライン送信に失敗しました');}
}
// Once the player has chosen to upload their history, future completed lives
// are automatically submitted as well. No current, unfinished life is sent.
const LC_archiveLifeBeforeOnline=LC_archiveLife;
LC_archiveLife=function(source,status='人生終了'){
  const result=LC_archiveLifeBeforeOnline.apply(this,arguments);
  try{if(localStorage.getItem(LC_ONLINE_OPTIN_KEY)==='1'&&status!=='プレイ中'){const rec=LC_makeLifeRecord(source,status);if(rec)LC_postOnlineRecords([rec],false).catch(err=>console.warn('Beat Life online archive sync failed:',err));}}catch(e){}
  return result;
};
document.addEventListener('click',function(e){
  const b=e.target.closest?.('[data-online-action]');if(!b)return;
  const a=b.dataset.onlineAction;
  if(a==='show'){LC_showOnlineRankings('net_worth');return;}
  if(a==='back'){LC_showRankings();return;}
  if(a==='refresh'){LC_showOnlineRankings(document.getElementById('LC_onlineCategory')?.value||LC_currentOnlineRankKey||'net_worth');return;}
  if(a==='upload'){LC_uploadLifeHistory();return;}
});
document.addEventListener('change',function(e){if(e.target?.id==='LC_onlineCategory')LC_showOnlineRankings(e.target.value);});

function LC_tryMilitaryPromotion(p,bonus=0){
 const m=p.military;if(!m)return;
 m.merit=Number(m.merit||0)+bonus;
 const ranks=LC_militaryRanks(m.branch);
 let promoted=false;
 while(m.rankIndex<ranks.length-1&&m.merit>=38+m.rankIndex*17){m.merit-=38+m.rankIndex*17;m.rankIndex++;m.serviceYears=(m.serviceYears||0);p.rank=m.rankIndex;p.salary=Math.round((p.salary||54000*p.cost)*1.1);promoted=true;addLog(`軍務での実績が認められ、${m.branch}の階級が「${ranks[m.rankIndex]}」に昇級した。給与も増額された。`);}
 if(promoted)toast(`昇級！ ${ranks[m.rankIndex]}`);
}

function LC_sparkline(values){
 const v=(values||[]).map(Number).filter(Number.isFinite);if(v.length<2)return '<span class="tiny muted">価格履歴を蓄積中</span>';
 const min=Math.min(...v),max=Math.max(...v),range=max-min||1,w=220,h=46,pad=3;
 const pts=v.map((x,i)=>`${(pad+i*(w-2*pad)/(v.length-1)).toFixed(1)},${(h-pad-((x-min)/range)*(h-2*pad)).toFixed(1)}`).join(' ');
 const up=v[v.length-1]>=v[0];const stroke=up?'#31c48d':'#ef6b73';
 return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="46" role="img" aria-label="株価推移"><polyline points="${pts}" fill="none" stroke="${stroke}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function LC_marketHud(){
 const holdings=state.portfolio||[];
 if(!holdings.length)return `<div class="lc-market-hud"><div class="row between"><b>📉 マーケット・株価チャート</b><span class="tiny">投資商品を保有すると表示</span></div><div class="tiny muted" style="margin-top:5px">「資産」または「投資」タブから株式・債券・ETF・暗号資産などを購入すると、ここに価格推移が表示されます。</div></div>`;
 return `<div class="lc-market-hud"><div class="row between"><b>📊 保有商品の株価チャート</b><span class="tiny">年ごとに更新</span></div><div class="lc-market-grid">${holdings.map(x=>{x.history=Array.isArray(x.history)?x.history:[Number(x.cost)||Number(x.price),Number(x.price)];const pct=x.cost?((x.price-x.cost)/x.cost*100):0;return `<div class="lc-chart-item"><div class="row between"><b>${esc(x.name)}</b><span class="${pct>=0?'green':'red'}">${pct>=0?'+':''}${pct.toFixed(1)}%</span></div>${LC_sparkline(x.history)}<div class="row between tiny"><span>現在値 ${money(x.price)}</span><span>取得 ${money(x.cost)}</span></div></div>`}).join('')}</div></div>`;
}
renderHud=function(){const p=state.player;const age=p.age===0?'0歳（新生児）':p.age+'歳';return `<div class="game-head"><div class="card"><div class="person-title"><div class="avatar">${p.alive?'👤':'🕊️'}</div><div><h1>${esc(p.name)} <span class="tag">${age}</span></h1><p>${esc(p.country)}・${esc(p.city)}　｜　${state.year}年　｜　${esc(p.sex)}</p><p>${p.job?esc(p.job.name):p.age<6?'幼児':p.age<16?'学生':p.retired?'引退':'職業未定'} ${p.partner?'・パートナーあり':''}</p></div></div><div class="hudstats"><div class="hudmini"><span>💰 所持金</span><b>${money(p.bank)}</b></div><div class="hudmini"><span>💼 年収</span><b>${money(Math.round((p.salary||0)+(p.sportCareer?.salary||0)))}</b></div><div class="hudmini"><span>🏦 純資産</span><b>${money(netWorth())}</b></div></div>${LC_marketHud()}</div><div class="card"><div class="row between"><b>人生ステータス</b><span class="tiny">${p.alive?'生存中':'人生終了'}</span></div>${stat('健康',p.health,'greenbar')}${stat('幸福',p.happiness,'goldbar')}${stat('知性',p.smarts)}${stat('容姿',p.looks,'purplebar')}${stat('体力',p.fitness,'greenbar')}<div class="row between tiny"><span>ストレス ${Math.round(p.stress)}%</span><span>名声 ${Math.round(p.fame)}%</span><span>カルマ ${Math.round(p.karma)}%</span></div></div></div>`};

function LC_createMovie(){
 const p=state.player;const title=String($('#blMovieTitle')?.value||'').trim().slice(0,36)||'無題の作品';const genre=$('#blMovieGenre')?.value||'ドラマ';const base=Number($('#blMovieBudget')?.value)||5000;const budget=Math.round(base*p.cost);
 if(p.bank<budget){toast(`制作予算 ${money(budget)} が足りません`);return;}
 p.bank-=budget;
 const genreBoost={'アクション':1.05,'コメディ':1.02,'ドラマ':1,'SF':1.12,'ミステリー':1.04,'スリラー':1.05,'ホラー':1.08,'恋愛':.98,'ドキュメンタリー':.82,'アニメーション':1.15,'ファンタジー':1.1,'歴史・戦争':1.03}[genre]||1;
 const multiplier=(.35+Math.random()*1.65)*genreBoost*(.68+p.smarts/220+p.fame/400);
 const revenue=Math.max(0,Math.round(budget*multiplier));const profit=revenue-budget;
 p.bank+=revenue;const rating=clamp(35+p.smarts*.34+p.fame*.16+(multiplier-1)*25+Math.random()*12,5,99);p.fame=clamp(p.fame+(rating>=80?pick([7,10,14]):rating>=60?pick([3,5,7]):1));p.happiness=clamp(p.happiness+(profit>0?5:-3));p.stress=clamp(p.stress+Math.round(base/50000));

 closeModal();save();render();toast(profit>=0?`映画が黒字！ ${money(profit)}の利益`:`興行が振るわず ${money(Math.abs(profit))}の損失`);

 return `<div class="card" style="margin-top:14px"><div class="row between"><h3>🏟️ プロスポーツに挑戦</h3><span class="tag">12競技</span></div><p class="tiny">サッカー、バスケットボール、野球、クリケット、ラグビー、テニス、アイスホッケー、バレーボール、アメリカンフットボール、ハンドボール、ゴルフ、モータースポーツから選択。居住国のリーグ・ツアーをもとに所属先を決めます。</p><button class="primary" data-bl-action="sportsJoin" ${p.age<16?'disabled':''}>競技と所属リーグを選ぶ</button></div>`;
}
function LC_sportTrain(){const p=state.player,c=p.sportCareer;if(!c)return;const fee=Math.round(450*p.cost);if(p.bank<fee){toast(`トレーニング費 ${money(fee)} が必要です`);return;}p.bank-=fee;p.fitness=clamp(p.fitness+pick([3,4,5,6]));p.health=clamp(p.health+1);c.points=(c.points||0)+8;c.experience=(c.experience||0)+1;addLog(`${c.sport}の専門トレーニングを行い、競技力を高めた。`);save();render();}
function LC_sportMatch(){const p=state.player,c=p.sportCareer;if(!c)return;const odds=clamp(34+p.fitness*.48+p.smarts*.12+(c.level||0)*5+(c.points||0)*.12,10,92);if(chance(odds)){c.record.wins++;c.points+=18+Math.round(p.fitness/10);const prize=Math.round((1200+Math.random()*5200)*(1+(c.level||0)*.35)*p.cost);p.bank+=prize;p.fame=clamp(p.fame+pick([1,2,4]));p.happiness=clamp(p.happiness+4);addLog(`${c.league}の公式戦で勝利。賞金・報酬 ${money(prize)} を獲得した。`);if(c.points>=75&&c.level<5){c.points-=75;c.level++;c.salary=Math.round(c.salary*1.35);addLog(`${c.sport}で成績が認められ、${c.league}のカテゴリーが「${['育成・下部カテゴリー','2部・チャレンジ枠','トップリーグ登録選手','主力選手','スター選手','代表候補'][c.level]}」に上がった。契約報酬も増えた。`);}}
 else{c.record.losses++;c.points+=5;p.stress=clamp(p.stress+3);if(chance(8)){p.health=clamp(p.health-6);addLog(`${c.league}の試合で敗れ、軽いけがをした。`);}else addLog(`${c.league}の試合で敗れた。次の試合に向けて練習を続ける。`);}
 save();render();
}
function LC_sportRetire(){const p=state.player,c=p.sportCareer;if(!c)return;addLog(`${c.sport}のプロ競技キャリアを引退した。通算成績は${c.record.wins}勝${c.record.losses}敗。`);p.sportCareer=null;save();render();}

 showModal(`🪖 ${LC_militaryLabel(p.country)}への入隊`,`<p class="tiny">${esc(p.country)}で選べる軍種を選んでください。入隊後は年ごとの軍務イベントで実績を積み、メインストーリー内で昇級していきます。</p>${branches.map((b,i)=>`<div class="item"><div><strong>${esc(b)}</strong><small>体力 ${Math.round(p.fitness)} · 知性 ${Math.round(p.smarts)} · 初任給目安 ${money(Math.round(54000*p.cost/12))}/月</small></div><button class="small primary" data-bl-modal="militaryJoin" data-branch="${esc(b)}" ${p.fitness<38?'disabled':''}>この軍に入隊</button></div>`).join('')}`);

function LC_prepareDatingSession(p){

 p.datingQueue=[...contacts,...strangers];

}

// ─────────────────────────────────────────────────────────────────────────────
// Beat Life accounts: username/password via Supabase Auth.
// Passwords are never stored in localStorage or the score table.
// Usernames are mapped to synthetic email identifiers; email confirmation must
// be disabled in Supabase Auth settings for this username-only registration flow.
// ─────────────────────────────────────────────────────────────────────────────
const BL_ACCOUNT_KEY='beatLifeAccountSession_v1';
let BL_ACCOUNT=null;
try{BL_ACCOUNT=JSON.parse(localStorage.getItem(BL_ACCOUNT_KEY)||'null');}catch(e){BL_ACCOUNT=null;}
async function BL_userEmail(username){
 const normalized=String(username).normalize('NFC');
 // Keep the original address mapping for accounts created by older Beat Life builds.
 if(/^[A-Za-z0-9_]{3,20}$/.test(normalized))return `${normalized.trim().toLowerCase()}@accounts.beatlife.invalid`;
 const bytes=new TextEncoder().encode(normalized);
 try{
  if(globalThis.crypto?.subtle){
   const digest=await globalThis.crypto.subtle.digest('SHA-256',bytes);
   const hex=Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,'0')).join('');
   return `${hex}@accounts.beatlife.invalid`;
  }
 }catch(e){}
 // Deterministic fallback for older/local browser contexts without Web Crypto.
 let h1=0x811c9dc5,h2=0x9e3779b9,h3=0x85ebca6b,h4=0xc2b2ae35;
 for(const b of bytes){h1=Math.imul(h1^b,0x01000193);h2=Math.imul(h2^b,0x5bd1e995);h3=Math.imul(h3^b,0x27d4eb2d);h4=Math.imul(h4^b,0x165667b1);}
 const hex=[h1,h2,h3,h4].map(v=>(v>>>0).toString(16).padStart(8,'0')).join('');
 return `${hex}@accounts.beatlife.invalid`;
}
function BL_authHeaders(extra={}){return {'apikey':LC_SUPABASE_PUBLISHABLE_KEY,'Content-Type':'application/json',...extra};}
function BL_accountStore(session,user){BL_ACCOUNT={access_token:session.access_token,refresh_token:session.refresh_token,expires_at:Date.now()+(Number(session.expires_in)||3600)*1000,user:{id:user.id,username:user.user_metadata?.username||user.email?.split('@')[0]||'Player'}};localStorage.setItem(BL_ACCOUNT_KEY,JSON.stringify(BL_ACCOUNT));}
function BL_accountValid(){return !!(BL_ACCOUNT?.access_token&&BL_ACCOUNT?.user?.id);}
async function BL_authRequest(path,body){const r=await fetch(`${LC_SUPABASE_URL}/auth/v1/${path}`,{method:'POST',headers:BL_authHeaders(),body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.msg||j.message||j.error_description||j.error||`認証エラー（${r.status}）`);return j;}
function BL_accountModal(mode='signup',message=''){
 const signup=mode==='signup';
 showModal('Beat Life アカウント',`<p class="tiny">1つのアカウントで複数の人生を保存し、すべての人生記録を同じプレイヤー名で世界ランキングに登録できます。</p>${message?`<div class="notice" style="margin-bottom:10px">${esc(message)}</div>`:''}<div class="row" style="gap:8px;margin:10px 0"><button data-bl-auth-mode="signup" class="${signup?'primary':''}">新規登録</button><button data-bl-auth-mode="login" class="${!signup?'primary':''}">ログイン</button></div><form id="BL_accountForm"><div class="field"><label>ユーザーネーム（1〜32文字・日本語や各国の言語、数字、記号、絵文字も使用可能）</label><input id="BL_username" autocomplete="username" autocapitalize="off" spellcheck="false" required placeholder="好きな名前を入力"></div><div class="field" style="margin-top:10px"><label>パスワード（8文字以上）</label><input id="BL_password" type="password" minlength="8" autocomplete="${signup?'new-password':'current-password'}" required placeholder="8文字以上"></div>${signup?'<div class="field" style="margin-top:10px"><label>パスワード（確認）</label><input id="BL_password2" type="password" minlength="8" autocomplete="new-password" required placeholder="もう一度入力"></div>':''}<button class="primary" type="submit" style="width:100%;margin-top:14px">${signup?'アカウントを作成':'ログイン'}</button></form><p class="tiny muted" style="margin-top:12px">パスワードはSupabase Authで安全に管理され、ゲーム内の人生データやランキング表には保存されません。ユーザーネームはランキングに表示されます。</p>`);
 // Authentication is mandatory: remove the generic modal close control.
 document.querySelector('#modal [data-modal-action="close"]')?.remove();
 document.querySelectorAll('[data-bl-auth-mode]').forEach(b=>b.addEventListener('click',()=>BL_accountModal(b.dataset.blAuthMode)));
 document.getElementById('BL_accountForm')?.addEventListener('submit',async ev=>{
  ev.preventDefault();const username=document.getElementById('BL_username').value.normalize('NFC').trim(),password=document.getElementById('BL_password').value;
  const usernameLength=Array.from(username).length;
  if(!username||usernameLength>32||/[\u0000-\u001F\u007F]/u.test(username)){toast('ユーザーネームは1〜32文字で入力してください（制御文字は使用できません）');return;}
  if(password.length<8){toast('パスワードは8文字以上にしてください');return;}
  if(signup&&password!==document.getElementById('BL_password2').value){toast('確認用パスワードが一致しません');return;}
  const submit=ev.currentTarget.querySelector('button[type="submit"]');submit.disabled=true;submit.textContent='処理中...';
  try{
   let result;
   if(signup){result=await BL_authRequest('signup',{email:await BL_userEmail(username),password,data:{username}});if(!result.access_token)throw new Error('登録は受け付けられましたが、メール確認が有効です。SupabaseのAuthentication設定でConfirm emailをOFFにしてからログインしてください。');}
   else result=await BL_authRequest('token?grant_type=password',{email:await BL_userEmail(username),password});
   BL_accountStore(result,result.user);BL_profileOnAccountReady();closeModal();toast(`ログインしました：${username}`);render();
  }catch(err){toast(err.message||'アカウント処理に失敗しました');submit.disabled=false;submit.textContent=signup?'アカウントを作成':'ログイン';}
 });
}
async function BL_refreshSession(){if(!BL_ACCOUNT?.refresh_token)return false;try{const j=await BL_authRequest('token?grant_type=refresh_token',{refresh_token:BL_ACCOUNT.refresh_token});BL_accountStore(j,j.user);return true;}catch(e){localStorage.removeItem(BL_ACCOUNT_KEY);BL_ACCOUNT=null;return false;}}

// Beat Life player profile (account-scoped, browser-local profile data).
// Profile/avatar/playtime are stored per Supabase account in this browser's
// localStorage. Existing gameplay and save formats remain untouched.
// ─────────────────────────────────────────────────────────────────────────────
const BL_PROFILE_PREFIX='beatLifeProfile_v1_';
let BL_profileSessionStarted=false;
let BL_profileLastTick=null;
let BL_profileTimerStarted=false;
function BL_profileKey(){return BL_PROFILE_PREFIX+(BL_ACCOUNT?.user?.id||'guest');}
function BL_profileDefault(){return {avatarData:null,playtimeMs:0,sessionCount:0,livesStarted:0,lifeIds:[],createdAt:new Date().toISOString(),lastPlayedAt:null};}
function BL_getProfile(){
 const fallback=BL_profileDefault();
 if(!BL_accountValid())return fallback;
 try{
  const raw=localStorage.getItem(BL_profileKey());
  const p=raw?JSON.parse(raw):fallback;
  if(!p||typeof p!=='object')return fallback;
  return {...fallback,...p,lifeIds:Array.isArray(p.lifeIds)?p.lifeIds:[]};
 }catch(e){return fallback;}
}
function BL_saveProfile(profile){
 if(!BL_accountValid())return false;
 try{localStorage.setItem(BL_profileKey(),JSON.stringify(profile));return true;}
 catch(e){toast('プロフィールを保存できませんでした。画像サイズやブラウザ容量を確認してください。');return false;}
}
function BL_profileOnAccountReady(){
 if(!BL_accountValid())return;
 BL_claimLegacyLives();
 BL_profileBeginSession();
 BL_renderProfileDock();
}
function BL_claimLegacyLives(){
 if(!BL_accountValid()||typeof LC_readHistory!=='function')return;
 try{
  const records=LC_readHistory();let changed=false;
  for(const r of records){if(r&&!r.accountId){r.accountId=BL_ACCOUNT.user.id;r.accountUsername=BL_accountName();changed=true;}}
  if(changed)LC_writeHistory(records);
 }catch(e){}
}
// Attach the current account to newly archived and currently displayed records.
const BL_profileBaseMakeLifeRecord=LC_makeLifeRecord;
LC_makeLifeRecord=function(source,status){
 const record=BL_profileBaseMakeLifeRecord.apply(this,arguments);
 if(record&&BL_accountValid()){record.accountId=BL_ACCOUNT.user.id;record.accountUsername=BL_accountName();}
 return record;
};
function BL_profileMarkLife(id){
 if(!BL_accountValid()||!id)return;
 const p=BL_getProfile(),key=String(id);
 if(!p.lifeIds.includes(key)){p.lifeIds.push(key);if(p.lifeIds.length>1000)p.lifeIds=p.lifeIds.slice(-1000);p.livesStarted=(Number(p.livesStarted)||0)+1;BL_saveProfile(p);}
}
const BL_profileBaseNewLife=newLife;
newLife=function(){const result=BL_profileBaseNewLife.apply(this,arguments);BL_profileMarkLife(state?.lifeRecordId);return result;};
const BL_profileBaseContinueAsHeir=continueAsHeir;
continueAsHeir=function(){const result=BL_profileBaseContinueAsHeir.apply(this,arguments);BL_profileMarkLife(state?.lifeRecordId);return result;};
function BL_profileFlush(){
 if(!BL_accountValid()||!BL_profileSessionStarted||BL_profileLastTick===null)return;
 const now=Date.now();
 const delta=Math.max(0,Math.min(now-BL_profileLastTick,15000));
 if(delta){const p=BL_getProfile();p.playtimeMs=(Number(p.playtimeMs)||0)+delta;p.lastPlayedAt=new Date(now).toISOString();BL_saveProfile(p);}
 const live=document.getElementById('BL_profilePlaytime');if(live)live.textContent=BL_formatPlaytime(BL_getProfile().playtimeMs);
 BL_profileLastTick=now;
}
function BL_profileBeginSession(){
 if(!BL_accountValid()||BL_profileSessionStarted)return;
 const p=BL_getProfile();p.sessionCount=(Number(p.sessionCount)||0)+1;p.lastPlayedAt=new Date().toISOString();BL_saveProfile(p);
 BL_profileSessionStarted=true;BL_profileLastTick=document.visibilityState==='visible'?Date.now():null;
 if(!BL_profileTimerStarted){BL_profileTimerStarted=true;setInterval(BL_profileFlush,10000);}
}
document.addEventListener('visibilitychange',()=>{
 if(document.visibilityState==='hidden'){BL_profileFlush();BL_profileLastTick=null;}
 else if(BL_accountValid()&&BL_profileSessionStarted)BL_profileLastTick=Date.now();
});
window.addEventListener('beforeunload',()=>BL_profileFlush());
function BL_formatPlaytime(ms){
 const total=Math.max(0,Math.floor((Number(ms)||0)/60000)),days=Math.floor(total/1440),hours=Math.floor((total%1440)/60),minutes=total%60;
 if(days)return `${days}日 ${hours}時間 ${minutes}分`;
 if(hours)return `${hours}時間 ${minutes}分`;
 return `${minutes}分`;
}
function BL_accountLifeRecords(){
 try{return LC_allLifeRecords().filter(r=>r&&r.accountId===BL_ACCOUNT.user.id).sort((a,b)=>String(b.savedAt||'').localeCompare(String(a.savedAt||'')));}
 catch(e){return [];}
}
function BL_avatarMarkup(profile,large=false){
 const className=large?'bl-profile-large-avatar':'bl-profile-avatar';
 const initial=Array.from(BL_accountName())[0]||'B';
 return `<div class="${className}">${profile.avatarData?`<img src="${esc(profile.avatarData)}" alt="プロフィール画像">`:esc(initial)}</div>`;
}
function BL_renderProfileDock(){
 document.getElementById('BL_profileDock')?.remove();
 if(!BL_accountValid())return;
 const p=BL_getProfile();
 document.body.insertAdjacentHTML('beforeend',`<div id="BL_profileDock"><button class="bl-profile-open" type="button" data-bl-open-profile aria-label="プレイヤープロフィールを開く">${BL_avatarMarkup(p)}<span class="bl-profile-label"><strong>${esc(BL_accountName())}</strong><small>プレイヤープロフィール</small></span></button></div>`);
}
function BL_showProfile(){
 if(!BL_requireAccount())return;
 BL_profileFlush();
 const p=BL_getProfile(),records=BL_accountLifeRecords();
 const started=Math.max(Number(p.livesStarted)||0,records.length);
 const completed=records.filter(r=>r.status!=='プレイ中');
 const active=records.filter(r=>r.status==='プレイ中').length;
 const bestAge=records.reduce((m,r)=>Math.max(m,Number(r.age)||0),0);
 const bestWorth=records.reduce((best,r)=>!best||Number(r.netWorth)>Number(best.netWorth)?r:best,null);
 const totalChildren=records.reduce((n,r)=>n+(Number(r.children)||0),0);
 const totalEvents=records.reduce((n,r)=>n+(Number(r.events)||0),0);
 const lifeRows=records.length?records.slice(0,30).map((r,i)=>`<div class="bl-profile-life"><div class="bl-profile-life-title"><strong>${i+1}. ${esc(r.name||'不明')}</strong><span class="tag ${r.status==='プレイ中'?'greentag':'goldtag'}">${esc(r.status||'記録')}</span></div><small>${esc(r.country||'不明')} · ${Number(r.age)||0}歳 · ${Number(r.year)||0}年</small><small>職業：${esc(r.job||'職業なし')} · 純資産：${esc(r.currencySymbol||'¤')}${fmt(r.netWorth)}</small></div>`).join(''):'<div class="empty">まだ人生の記録がありません。新しい人生を始めよう！</div>';
 const created=p.createdAt?new Date(p.createdAt).toLocaleDateString('ja-JP'):'—';
 const last=p.lastPlayedAt?new Date(p.lastPlayedAt).toLocaleString('ja-JP'):'—';
 showModal('プレイヤープロフィール',`
  <div class="bl-profile-head">${BL_avatarMarkup(p,true)}<div style="min-width:0"><div class="tiny muted">プレイヤー</div><strong style="font-size:19px;overflow-wrap:anywhere">${esc(BL_accountName())}</strong><div class="bl-profile-actions"><label class="bl-profile-action" for="BL_avatarUpload">画像をアップロード</label><input id="BL_avatarUpload" type="file" accept="image/*" hidden>${p.avatarData?'<button type="button" class="bl-profile-action" data-bl-remove-avatar>画像を削除</button>':''}</div></div></div>
  <div class="notice">アカウントに紐づく、このブラウザ内のプレイ記録です。プロフィール画像・プレイ時間・人生の記録は端末のブラウザに保存されます。</div>
  <div class="bl-profile-stats">
   <div class="bl-profile-stat"><small>累計プレイ時間</small><strong id="BL_profilePlaytime">${BL_formatPlaytime(p.playtimeMs)}</strong></div>
   <div class="bl-profile-stat"><small>プレイした人生</small><strong>${started.toLocaleString('ja-JP')} 人生</strong></div>
   <div class="bl-profile-stat"><small>記録済みの人生</small><strong>${records.length.toLocaleString('ja-JP')} 人生</strong></div>
   <div class="bl-profile-stat"><small>終了・中断・継承した人生</small><strong>${completed.length.toLocaleString('ja-JP')} 人生</strong></div>
   <div class="bl-profile-stat"><small>プレイセッション</small><strong>${(Number(p.sessionCount)||0).toLocaleString('ja-JP')} 回</strong></div>
   <div class="bl-profile-stat"><small>現在プレイ中</small><strong>${active.toLocaleString('ja-JP')} 人生</strong></div>
   <div class="bl-profile-stat"><small>最高到達年齢</small><strong>${bestAge} 歳</strong></div>
   <div class="bl-profile-stat"><small>人生で育てた子ども</small><strong>${totalChildren.toLocaleString('ja-JP')} 人</strong></div>
   <div class="bl-profile-stat"><small>記録されたイベント</small><strong>${totalEvents.toLocaleString('ja-JP')} 件</strong></div>
   <div class="bl-profile-stat"><small>最高純資産</small><strong>${bestWorth?esc(bestWorth.currencySymbol||'¤')+fmt(bestWorth.netWorth):'—'}</strong></div>
  </div>
  <div class="divider"></div><div class="row between"><b>これまでの人生</b><span class="tiny muted">${records.length}件</span></div>
  <div class="bl-profile-lives">${lifeRows}</div>
  <div class="divider"></div><div class="tiny muted">この端末での記録開始：${esc(created)}<br>最終プレイ：${esc(last)}<br>ランキングに送信した人生は、世界ランキングにも表示されます。</div>
 `);
 const uploader=document.getElementById('BL_avatarUpload');
 uploader?.addEventListener('change',BL_handleAvatarUpload);
}
function BL_handleAvatarUpload(ev){
 const file=ev.target.files?.[0];if(!file)return;
 if(!file.type.startsWith('image/')){toast('画像ファイルを選択してください');ev.target.value='';return;}
 if(file.size>8*1024*1024){toast('画像は8MB以下のファイルを選んでください');ev.target.value='';return;}
 const reader=new FileReader();
 reader.onerror=()=>toast('画像を読み込めませんでした');
 reader.onload=()=>{
  const img=new Image();
  img.onerror=()=>toast('画像を開けませんでした');
  img.onload=()=>{
   try{
    const canvas=document.createElement('canvas'),size=256;canvas.width=size;canvas.height=size;
    const ctx=canvas.getContext('2d');
    const scale=Math.max(size/img.naturalWidth,size/img.naturalHeight),w=img.naturalWidth*scale,h=img.naturalHeight*scale;
    ctx.drawImage(img,(size-w)/2,(size-h)/2,w,h);
    let data=canvas.toDataURL('image/webp',0.82);if(!data.startsWith('data:image/webp'))data=canvas.toDataURL('image/jpeg',0.82);
    if(data.length>260000)data=canvas.toDataURL('image/jpeg',0.68);
    const profile=BL_getProfile();profile.avatarData=data;
    if(BL_saveProfile(profile)){toast('プロフィール画像を更新しました');BL_renderProfileDock();BL_showProfile();}
   }catch(err){toast('画像を保存できませんでした');}
  };
  img.src=reader.result;
 };
 reader.readAsDataURL(file);
}
document.addEventListener('click',e=>{
 if(e.target.closest?.('[data-bl-open-profile]')){BL_showProfile();return;}
 if(e.target.closest?.('[data-bl-remove-avatar]')){const p=BL_getProfile();p.avatarData=null;BL_saveProfile(p);BL_renderProfileDock();BL_showProfile();toast('プロフィール画像を削除しました');return;}
});
// Keep the fixed profile button visible after the game's normal screen renders.
const BL_profileBaseRender=render;
render=function(){BL_profileBaseRender.apply(this,arguments);BL_renderProfileDock();};

// Restore/start account-scoped tracking for existing authenticated sessions.
if(BL_accountValid()){
 if(BL_ACCOUNT.expires_at<Date.now()+60000){
  BL_refreshSession().then(ok=>{if(ok){BL_profileOnAccountReady();render();}else{BL_renderProfileDock();BL_accountModal('login','セッションの有効期限が切れました。再ログインしてください。');}});
 }else BL_profileOnAccountReady();
}
BL_renderProfileDock();

// Single source of truth for annual interest; cash covers interest first, only unpaid interest capitalizes.
function BL2_chargeInterest(p){if(!p)return 0;const debt=Math.max(0,Number(p.debt)||0);if(debt<=0){p.delayedPayment=false;return 0;}const interest=Math.round(debt*.06);const cash=Math.max(0,Number(p.bank)||0);const paid=Math.min(cash,interest);p.bank=cash-paid;p.debt=debt+(interest-paid);p.delayedPayment=interest>paid;return interest;}

const BL2_baseResolveChoice=resolveChoice;

 if(/仕事|職場|就職|昇進|退職|給料|会社/.test(t))return '💼';
 if(/家族|親|子ども|結婚|恋人|パートナー|デート/.test(t))return '❤️';
 if(/お金|銀行|借金|投資|宝くじ|当選|購入|資産/.test(t))return '💰';
 if(/病気|健康|医者|けが|事故|治療/.test(t))return '🏥';
 if(/犯罪|警察|逮捕|裁判|刑務所/.test(t))return '🚨';
 if(/友人|友達|交流|知り合い/.test(t))return '🤝';
 if(/旅行|移住|海外|冒険/.test(t))return '✈️';
 return '🟢';
}
function BL3_vital(label,icon,value,color){
 const n=clamp(Number(value)||0);
 return `<div class="bl3-vital"><div class="bl3-vital-head"><span>${icon} ${label}</span><b>${Math.round(n)}%</b></div><div class="bl3-vital-track"><i style="width:${n}%;background:${color}"></i></div></div>`;
}
function BL3_renderVitals(){
 const p=state.player;
 return `<section class="bl3-vitals" aria-label="主要ステータス">${BL3_vital('健康','❤️',p.health,'#ed3346')}${BL3_vital('幸福','🌟',p.happiness,'#f39a18')}${BL3_vital('知性','🧠',p.smarts,'#3262e9')}${BL3_vital('容姿','✨',p.looks,'#812be5')}</section><div class="bl3-secondary-stats"><span>🏃 体力 ${Math.round(p.fitness)}%</span><span>😵 ストレス ${Math.round(p.stress)}%</span><span>⭐ 名声 ${Math.round(p.fame)}%</span><span>⚖️ カルマ ${Math.round(p.karma)}%</span></div>`;
}
function BL3_renderPlayer(){
 const p=state.player, age=p.age===0?'0歳（新生児）':`${p.age}歳`, job=p.job?.name||(p.age<6?'幼児':p.age<16?'学生':p.retired?'引退':'職業未定'), ap=p.ap||{used:0,max:0};
 return `<section class="bl3-player-panel"><div class="bl3-player-name"><h1>${esc(p.name)} <span class="tag">${age}</span></h1><p>${esc(p.country)} · ${esc(p.city)} · ${state.year}年 · ${esc(p.sex)} · ${esc(job)}${p.partner?' · パートナーあり':''}</p></div><div class="bl3-player-money"><div class="bl3-money-chip"><small>💰 所持金</small><b>${money(p.bank)}</b></div><div class="bl3-money-chip"><small>💼 年収</small><b>${money(p.salary)}</b></div><div class="bl3-money-chip"><small>🏦 純資産</small><b>${money(netWorth())}</b></div><div class="bl3-money-chip"><small>⚡ 今年の行動</small><b>${ap.used||0}/${ap.max||0}</b></div></div></section>`;
}
function BL3_renderHome(){
 const entries=(state.log||[]).slice(0,24).map(x=>`<article class="bl3-feed-entry"><div class="bl3-feed-icon" aria-hidden="true">${BL3_feedIcon(x.text)}</div><div class="bl3-feed-content"><div class="bl3-feed-meta"><strong>${Number(x.year)||state.year}年</strong><span>${Number(x.age)||0}歳</span></div><p>${esc(x.text||'人生の出来事')}</p></div></article>`).join('');
 const homes=state.properties?.[0]?esc(state.properties[0].name):'家族と同居／住居未所有';
 const degree=state.player.degree?esc(state.player.degree)+' 学位':state.player.age<18?'在学中':'最終学歴なし';
 const goals=state.bl2?.lifeGoals||[];
 const goalHtml=goals.length?goals.map(g=>`<div class="bl3-goal-row"><div><span>${esc(g.name)}</span><b>${Math.round(g.progress||0)}%</b></div><div class="bar"><span style="width:${clamp(g.progress||0)}%;background:#e5ad3d"></span></div></div>`).join(''):`<div class="tiny">${esc(state.challenge?.name||'人生の目標')}</div><div class="bar" style="margin:8px 0"><span style="width:${clamp(state.challenge?.progress||0)}%;background:#e5ad3d"></span></div><small class="muted">進行度 ${Math.round(state.challenge?.progress||0)}%</small>`;
 return `<section class="bl3-home-feed"><div class="bl3-home-feed-head"><h2>📖 人生の記録</h2><div class="bl3-feed-tools"><button data-action="timeline">年表を見る</button><button data-action="tab" data-value="activities">行動する</button></div></div><div class="bl3-feed-scroll">${entries||'<div class="bl3-feed-empty">まだ記録はありません。中央の＋ボタンで人生を進めましょう。</div>'}</div></section><section class="bl3-overview-summary"><div class="bl3-summary-card"><h3>🧭 いまの状況</h3><div class="item"><div><strong>住まい</strong><small>${homes}</small></div><span>🏠</span></div><div class="item"><div><strong>学歴</strong><small>${degree}</small></div><span>🎓</span></div><div class="item"><div><strong>家族</strong><small>パートナー ${state.player.partner?'1人':'なし'} · 子ども ${state.player.children?.length||0}人</small></div><span>👪</span></div><div class="item"><div><strong>所有資産</strong><small>不動産 ${state.properties?.length||0}件 · 車・船 ${state.vehicles?.length||0}台</small></div><span>💎</span></div></div><div class="bl3-summary-card"><h3>🎯 人生の目標</h3>${goalHtml}</div><div class="bl3-summary-card"><h3>⚡ クイックアクション</h3><div class="bl3-shortcuts"><button data-action="gym">🏋️ 運動</button><button data-action="study">📚 勉強</button><button data-action="social">🤝 交流</button><button data-action="work">💼 副業</button></div><p class="tiny" style="margin:9px 0 0">詳しい行動は下部の「行動」から選べます。</p></div></section>`;
}
function BL3_renderCrime(){
 const p=state.player;
 return `<section class="card bl3-crime-card"><h2>🚨 犯罪に関する行動</h2><p class="muted">犯罪行為はゲーム内の抽象的な選択肢です。成功・発覚・罰金・服役などの結果が発生します。</p><div class="metric" style="margin:12px 0"><div class="row between"><span>犯罪歴</span><b>${p.crimeRecord||0}回</b></div><div class="row between"><span>捜査の警戒度</span><b>${Math.round(state.crimeHeat||0)}%</b></div></div><button class="danger crime-action" data-action="crime">🕶️ 犯罪を選ぶ</button><p class="tiny" style="margin:10px 0 0">行動にはリスクがあり、結果は能力や状況によって変わります。</p></section>`;
}
function BL3_renderWorldBody(){
 const keep=tab;tab='world';let html=BL3_previousRenderGame.apply(this,arguments);tab=keep;
 const navStart=html.indexOf('<div class="nav">');
 const navEnd=navStart>=0?html.indexOf('</div>',navStart)+6:-1;
 const footer=html.indexOf('<div class="row between" style="margin-top:15px">');
 if(navStart<0||navEnd<6||footer<0)return '<div class="card"><h2>🌐 世界</h2><p>世界情報を表示できませんでした。</p></div>';
 return html.slice(navEnd,footer);
}
function BL3_pageBody(){
 if(tab==='overview')return BL3_renderHome();
 if(tab==='relations')return renderRelations();
 if(tab==='career')return renderCareer();
 if(tab==='education')return renderEducation();
 if(tab==='assets'||tab==='market'||tab==='money')return `<div class="bl3-category-page">${renderAssets()}<div style="height:12px"></div>${renderMarket()}</div>`;
 if(tab==='activities')return renderActivities();
 if(tab==='crime')return BL3_renderCrime();
 if(tab==='expansions'||tab==='special')return renderExpansions();
 if(tab==='legacy'||tab==='progress')return renderLegacy();
 if(tab==='world')return BL3_renderWorldBody();
 return BL3_renderHome();
}
function BL3_dockActive(){
 if(['assets','market','money'].includes(tab))return 'money';
 if(['expansions','special'].includes(tab))return 'special';
 if(['legacy','progress'].includes(tab))return 'progress';
 return tab;
}
function BL3_renderDock(){
 const items=[['education','🎓','教育'],['career','💼','キャリア'],['activities','🎯','行動'],['relations','❤️','関係'],['money','💰','お金'],['crime','🚨','犯罪'],['special','✨','特別'],['progress','🏆','進捗']];
 const active=BL3_dockActive();
 return `<nav class="bl3-bottom-dock" aria-label="ゲームメニュー">${items.map(([key,icon,label])=>`<button class="bl3-dock-item ${active===key?'active':''}" data-action="tab" data-value="${key}" aria-label="${label}" ${active===key?'aria-current="page"':''}><span class="bl3-dock-icon">${icon}</span><small>${label}</small></button>`).join('')}</nav>`;
}
function BL3_lockAPButtons(html){
 const p=state?.player;if(!p)return html;
 const ap=BL2_syncAP();
 html=html.replace(/<button([^>]*data-action="([^"]+)"[^>]*)>/g,(full,attrs,a)=>{const cost=BL2_AP_COST[a]??0;if(a==='work'&&(ap.counts.work||0)>=1&&!attrs.includes('disabled'))return `<button${attrs} disabled title="副業は年1回までです">`;if(!cost||attrs.includes('disabled')||state.unlocks?.god&&state.settings?.godUnlimitedAP)return full;if(ap.used+cost>ap.max)return `<button${attrs} disabled title="行動ポイント不足：${cost}必要、残り${Math.max(0,ap.max-ap.used)}">`;return full;});
 html=html.replace(/<button([^>]*data-bl-action="([^"]+)"[^>]*)>/g,(full,attrs,a)=>{const cost=BL2_AP_COST[a]??0;if(!cost||attrs.includes('disabled')||state.unlocks?.god&&state.settings?.godUnlimitedAP)return full;if(ap.used+cost>ap.max)return `<button${attrs} disabled title="行動ポイント不足">`;return full;});
 return html;
}
renderGame=function(){
 if(!state?.player||!state.player.alive){document.body.classList.remove('bl3-game-active');return BL3_previousRenderGame.apply(this,arguments);}
 const p=state.player,ap=BL2_syncAP();
 const age=p.age===0?'0歳（新生児）':`${p.age}歳`;
 const pending=state.pending?`<div class="bl3-pending">${renderPending()}</div>`:'';
 const page=BL3_pageBody();
 const body=`<main class="bl3-game-shell"><header class="bl3-topbar"><button class="bl3-brand" data-action="tab" data-value="overview" aria-label="人生の記録へ戻る"><span class="bl3-brand-mark">B</span><span class="bl3-brand-copy"><strong>BEAT LIFE</strong><small>YOUR STORY, YOUR CHOICES</small></span></button><div class="bl3-top-actions"><span class="bl3-top-chip">${state.year}年 · ${age}</span><button data-action="tab" data-value="world">🌐 世界</button><button data-action="export">データ出力</button><button data-action="menu">タイトルへ</button></div></header>${BL3_renderPlayer()}${BL3_renderVitals()}${pending}<section class="bl3-category-page">${page}</section><footer class="bl3-game-footer"><span>自動保存済み · Beat Life · 行動 ${ap.used}/${ap.max}</span><div class="row"><button data-action="timeline">人生年表</button><button data-action="export">データ出力</button><button data-action="menu">タイトル画面</button></div></footer><button class="bl3-age-fab" data-action="age" aria-label="1年歳を取る" title="1年歳を取る" ${(!p.alive||state.pending)?'disabled':''}><span>＋</span></button>${BL3_renderDock()}</main>`;
 return BL3_lockAPButtons(body);
};

})();
</script>
</body>
</html>
